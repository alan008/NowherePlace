      rim.addColorStop(0.68, translucent(blendRgb(color, [241, 123, 153], 0.4), lowSun * sun.glow * 0.19));
      rim.addColorStop(1, translucent(blendRgb(color, [255, 170, 104], 0.28), lowSun * sun.glow * 0.6));
      ctx.fillStyle = rim;
      ctx.fillRect(0, 0, W, SKY_HEIGHT);
      const halo = ctx.createRadialGradient(x, y, 3, x, y, mix(55, 144, lowSun));
      halo.addColorStop(0, translucent(blendRgb(color, [255, 233, 211], 0.35), sun.glow * 0.52));
      halo.addColorStop(0.35, translucent(color, sun.glow * 0.27));
      halo.addColorStop(1, translucent(color, 0));
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, W, SKY_HEIGHT);
      const disk = blendRgb(color, [255, 250, 227], mix(0.32, 0.87, elevation));
      ctx.globalAlpha = 1 - weather.fog * 0.48;
      ellipse(ctx, cssColor(disk), x, y, 9, 9);
      pixels(ctx, cssColor(blendRgb(disk, color, 0.69)), x - 7, y + 4, 14);
      pixels(ctx, cssColor(blendRgb(disk, [255, 255, 249], 0.78)), x - 5, y - 3, 10, 2);
      ctx.globalAlpha = 1;
    }

    if (moon.brightness > 0) {
      const { x, y } = moon;
      const corona = ctx.createRadialGradient(x, y, 3, x, y, 42);
      corona.addColorStop(0, translucent([164, 191, 244], moon.brightness * 0.24));
      corona.addColorStop(0.36, translucent([141, 172, 230], moon.brightness * 0.12));
      corona.addColorStop(1, translucent([121, 151, 217], 0));
      ctx.fillStyle = corona;
      ctx.fillRect(0, 0, W, SKY_HEIGHT);
      ctx.globalAlpha = moon.brightness;
      drawCrescent(x, y);
      ctx.globalAlpha = 1;
    }

    drawClouds(clouds, sun, darkness, weather.rain);
  }

  function drawLandLayer(layers, light, part) {
    landContext.drawImage(layers[light.from][part], 0, 0);
    if (light.from !== light.to && light.blend > 0) {
      landContext.globalAlpha = light.blend;
      landContext.drawImage(layers[light.to][part], 0, 0);
      landContext.globalAlpha = 1;
    }
  }

  function castHouseShadow(item, dx, dy, ink) {
    const { left, right, peak, wall, roof, depth, rise } = dimensions(item);
    const project = (x, y, height) => [item.x + x * item.face + dx * height, item.y + y + dy * height];
    if (item.view === 'side') {
      polygon(shadowContext, ink, [project(left, 0, 0), project(right, 0, 0),
        project(right, 0, wall + roof), project(left, 0, wall + roof)]);
      return;
    }
    const ridge = project(peak, 0, wall + roof);
    const farRidge = project(peak + depth, -rise, wall + roof);
    const frontLeft = project(left, 0, wall);
    const frontRight = project(right, 0, wall);
    const backRight = project(right + depth, -rise, wall);
    polygon(shadowContext, ink, [project(left, 0, 0), project(right, 0, 0), frontRight, ridge, frontLeft]);
    polygon(shadowContext, ink, [project(right, 0, 0), project(right + depth, -rise, 0), backRight, frontRight]);
    polygon(shadowContext, ink, [frontRight, backRight, farRidge, ridge]);
    polygon(shadowContext, ink, [frontLeft, ridge, farRidge, project(left + depth, -rise, wall)]);
  }

  function castTreeShadow(item, dx, dy, ink) {
    const { x, y, height, width, kind } = item;
    if (kind === 'leaf' && season === 'winter') {
      const project = (reach, spread) => [x + dx * height * reach + spread, y + dy * height * reach];
      trace(shadowContext, ink, x, y, ...project(0.91, 0), 2);
      for (let branch = 0; branch < 7; branch++) {
        const reach = 0.25 + branch * 0.085;
        trace(shadowContext, ink, ...project(reach, 0), ...project(reach + 0.18, (branch % 2 ? 1 : -1) * width * 0.42));
      }
      return;
    }
    const axis = Math.hypot(dx, dy);
    const acrossX = dy / axis * 0.92;
    const acrossY = -dx / axis * 0.51;
    const outline = kind === 'pine'
      ? [[0, -0.07], [0.21, -0.07], [0.16, -0.53], [0.43, -0.28], [0.35, -0.41],
        [0.64, -0.18], [0.56, -0.26], [1, 0], [0.57, 0.24], [0.64, 0.16], [0.34, 0.43],
        [0.43, 0.28], [0.16, 0.53], [0.21, 0.07], [0, 0.07]]
      : [[0, -0.08], [0.37, -0.09], [0.43, -0.45], [0.55, -0.66], [0.72, -0.67],
        [0.89, -0.47], [0.97, -0.18], [0.97, 0.25], [0.86, 0.53], [0.69, 0.67],
        [0.53, 0.58], [0.41, 0.32], [0.37, 0.09], [0, 0.08]];
    polygon(shadowContext, ink, outline.map(([reach, span]) => [
      x + dx * height * reach + acrossX * width * span,
      y + dy * height * reach + acrossY * width * span
    ]));
  }

  let shadowPosition = -1;

  function drawCastShadows(world, sun) {
    if (sun.direct < 0.025) return;
    const position = Math.round(sun.progress * 520);
    if (position !== shadowPosition) {
      shadowPosition = position;
      const angle = position / 520 * Math.PI;
      const elevation = Math.sin(angle);
      const reach = mix(2.8, 0.27, elevation ** 0.67);
      const dx = -Math.cos(angle) * reach;
      const dy = (0.47 + elevation * 0.23) * reach;
      const ink = cssColor(blendRgb([56, 43, 69], [38, 54, 65], elevation));
      shadowContext.clearRect(0, 0, W, H);
      for (const item of world.items) {
        if (item.kind === 'house') castHouseShadow(item, dx, dy, ink);
        if (item.kind === 'pine' || item.kind === 'leaf') castTreeShadow(item, dx, dy, ink);
      }
    }
    const shadow = sun.direct * (0.54 + (1 - sun.elevation) * 0.19);
    const soft = mix(0.72, 1.85, 1 - sun.gap);
    landContext.save();
    landContext.filter = 'blur(' + soft + 'px)';
    landContext.globalAlpha = shadow * 0.4;
    landContext.drawImage(shadowCanvas, 0, 0);
    landContext.restore();
    landContext.globalAlpha = shadow * mix(0.41, 0.83, sun.gap);
    landContext.drawImage(shadowCanvas, 0, 0);
    landContext.globalAlpha = 1;
  }

  function gradeLandscape(sun, moon, clouds, weather, hour) {
    const day = smooth((hour - 4) / 2.5) * smooth((21.8 - hour) / 2.7);
    const obscured = sun.active ? 1 - sun.gap : clouds.coverage;
    const dim = (clouds.coverage * 0.25 + obscured * 0.19 + weather.rain * 0.07) * day
      + clouds.coverage * (1 - day) * 0.13;
    landContext.globalCompositeOperation = 'source-atop';
    if (dim > 0.005) {
      const ambient = landContext.createLinearGradient(0, 68, 0, H);
      ambient.addColorStop(0, translucent([108, 124, 144], dim * 0.54));
      ambient.addColorStop(0.44, translucent([62, 79, 97], dim));
      ambient.addColorStop(1, translucent([40, 53, 74], dim * 1.08));
      landContext.fillStyle = ambient;
      landContext.fillRect(0, 0, W, H);
    }
    if (moon.darkness > 0.005) {
      const shade = moon.darkness * (1 - moon.direct) * (0.16 + clouds.coverage * 0.13);
      landContext.fillStyle = translucent([9, 16, 31], shade);
      landContext.fillRect(0, 0, W, H);
    }
    if (sun.direct > 0.005) {
      const warmth = 1 - smooth((sun.elevation - 0.24) / 0.71);
      const tint = blendRgb([255, 251, 228], blendRgb(sun.color, [255, 155, 111], 0.38), warmth);
      const strength = sun.direct * mix(0.18, 0.59, warmth);
      const center = mix(W * 0.5, sun.x, 0.72);
      const light = landContext.createRadialGradient(center, sun.y + 80, 18, center, sun.y + 80, mix(405, 298, clouds.coverage));
      light.addColorStop(0, translucent(tint, strength));
      light.addColorStop(0.67, translucent(blendRgb(tint, [255, 210, 169], warmth * 0.24), strength * 0.59));
      light.addColorStop(1, translucent(tint, strength * 0.13));
      landContext.fillStyle = light;
      landContext.fillRect(0, 0, W, H);
    }
    landContext.globalCompositeOperation = 'source-over';
  }

  function drawLand(world, layers, light, hour, motion, weather, clouds, sun, moon) {
    landContext.clearRect(0, 0, W, H);
    drawLandLayer(layers, light, 'terrain');
    const actors = groundPopulation(world, motion, hour);
    updateFootprints(world, actors, motion);
    drawFootprints(landContext, world, motion);
    drawCastShadows(world, sun);
    let nextActor = 0;
    for (let i = 0; i < world.items.length; i++) {
      const sprite = layers[light.from].sprites[i];
      while (nextActor < actors.length && actors[nextActor].y <= sprite.y) {
        drawGroundActor(landContext, actors[nextActor++], motion);
      }
      landContext.drawImage(sprite.canvas, sprite.left, sprite.top);
      if (light.from !== light.to && light.blend > 0) {
        const other = layers[light.to].sprites[i];
        landContext.globalAlpha = light.blend;
        landContext.drawImage(other.canvas, other.left, other.top);
        landContext.globalAlpha = 1;
      }
    }
    while (nextActor < actors.length) drawGroundActor(landContext, actors[nextActor++], motion);
    gradeLandscape(sun, moon, clouds, weather, hour);
    if (moon.direct > 0.005) {
      const tint = moon.direct * 0.84;
      landContext.globalAlpha = tint * (1 - moon.right);
      landContext.drawImage(world.moonMasks[0], 0, 0);
      landContext.globalAlpha = tint * moon.right;
      landContext.drawImage(world.moonMasks[1], 0, 0);
      landContext.globalAlpha = 1;
    }
    const camp = campState(world.population.camp, hour);
    if (camp && camp.heat > 0) {
      const hearth = world.population.camp;
      const flicker = 0.91 + Math.sin(motion * 13) * 0.05 + Math.sin(motion * 21) * 0.04;
      const glow = landContext.createRadialGradient(hearth.x, hearth.y - 3, 2, hearth.x, hearth.y - 3, 32);
      glow.addColorStop(0, 'rgba(255, 191, 91,' + camp.heat * flicker * 0.58 + ')');
      glow.addColorStop(0.35, 'rgba(245, 135, 55,' + camp.heat * flicker * 0.32 + ')');
      glow.addColorStop(1, 'rgba(233, 108, 44,0)');
      landContext.globalCompositeOperation = 'source-atop';
      landContext.fillStyle = glow;
      landContext.fillRect(hearth.x - 33, hearth.y - 36, 66, 66);
      landContext.globalCompositeOperation = 'source-over';
    }
    ctx.drawImage(landCanvas, 0, 0);
    drawChimneySmoke(world, motion, hour);

    if (weather.fog > 0.02) {
      const tint = skyColor(seasonalColors[light.from].mist, seasonalColors[light.to].mist, light.blend);
      for (const [i, band] of world.atmosphere.fog.entries()) {
        const x = Math.round(wrap(band.x + motion * band.speed, W + 330) - 120);
        const y = band.y + Math.round(Math.sin(motion * 0.09 + i * 0.83) * 3);
        for (let layer = 0; layer < 4; layer++) {
          ctx.globalAlpha = weather.fog * (0.035 + layer * 0.009);
          ellipse(ctx, tint, x, y, band.width * (1.17 - layer * 0.17), band.depth * (1.04 - layer * 0.19));
        }
      }
      ctx.globalAlpha = 1;
    }

    for (const house of world.houses) {
      if (house.style === 'shed') continue;
      const strength = Math.max(smooth((hour - house.litAt) / 0.75), 1 - smooth((hour - house.goesDark) / 0.6));
      if (strength <= 0) continue;
      const d = dimensions(house);
      const groundX = house.x + house.face * (d.left + 6);
      for (let ring = 3; ring >= 1; ring--) {
        ctx.globalAlpha = strength * (0.045 + (3 - ring) * 0.028);
        ellipse(ctx, '#edaa61', groundX - 1, house.y + 4, 5 + ring * 4, 1.5 + ring);
      }
      ctx.save();
      ctx.translate(house.x, house.y);
      ctx.scale(house.face, 1);
      for (const { x, y, w, h } of houseWindows(house, d)) {
        ctx.globalAlpha = strength * 0.17;
        ellipse(ctx, '#efa849', x + w / 2, y + h / 2, w + 3, h + 3);
        ctx.globalAlpha = strength;
        pixels(ctx, '#dd8a44', x, y, w, h);
        pixels(ctx, '#f7bd64', x + 1, y + 1, Math.max(1, w - 2), Math.max(1, h - 2));
        pixels(ctx, '#ffe3a1', x + 1, y + 1, 1, Math.max(1, h - 2));
        if (w > 3) pixels(ctx, '#965c42', x + Math.floor(w / 2), y, 1, h);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    if (weather.rain > 0.02) {
      if (season === 'winter') {
        drawSnowfall(world, motion, weather.rain, moon.darkness);
        return;
      }
      for (const drop of world.atmosphere.drops) {
        const travel = motion * drop.speed;
        const x = Math.round(wrap(drop.x - travel * 0.36, W + 80) - 35);
        const y = Math.round(wrap(drop.y + travel, H + 50) - 22);
        ctx.globalAlpha = weather.rain * mix(0.11, 0.37, drop.tone);
        trace(ctx, '#cbd8cf', x, y, x - Math.ceil(drop.length * 0.36), y + drop.length);
        if (y > 182 && drop.tone > 0.82 && wrap(travel + drop.y, 67) < 7) {
          pixels(ctx, '#c2c8a3', x - 2, y + 2, 3);
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  function createSeasonEffects(world) {
    const random = randomFrom(hash(world.code + '/сезоны'));
    return {
      snow: Array.from({ length: 185 }, () => ({
        x: between(random, 0, W + 100), y: between(random, 0, H + 40), speed: between(random, 8, 29),
        phase: between(random, 0, Math.PI * 2), size: random(), drift: between(random, 2, 11)
      })),
      leaves: world.items.filter(item => item.kind === 'leaf').flatMap(tree =>
        Array.from({ length: Math.max(4, Math.round(tree.height / 5)) }, () => ({
          tree, phase: between(random, 0, 16), period: between(random, 11, 18),
          x: between(random, -0.4, 0.4) * tree.width, lift: between(random, 0.38, 0.85) * tree.height,
          sway: between(random, 2, 7), shade: integer(random, 1, 4)
        }))),
      footprints: [], previous: new Map(), lastMotion: motion
    };
  }

  function fallingLeaves(world, motion) {
    const light = lightingAt(simulatedMinutes / 60);
    return world.seasonEffects.leaves.map(leaf => {
      const age = wrap(motion + leaf.phase, leaf.period);
      const fall = clamp(age / (leaf.period * 0.7));
      const airborne = 1 - smooth((fall - 0.85) / 0.15);
      const shadesA = treeLeafColors(leaf.tree, seasonalColors[light.from]);
      const shadesB = treeLeafColors(leaf.tree, seasonalColors[light.to]);
      return { kind: 'leafParticle', x: leaf.tree.x + leaf.x + fall * 10 +
          Math.sin(age * 1.2 + leaf.phase) * leaf.sway * airborne,
        y: leaf.tree.y + 1, leafY: mix(leaf.tree.y - leaf.lift, leaf.tree.y + 2, fall),
        color: skyColor(shadesA[leaf.shade], shadesB[leaf.shade], light.blend),
        wide: Math.sin(age * 3 + leaf.phase) > 0, alpha: smooth((leaf.period - age) / 0.6) };
    });
  }

  function drawSnowfall(world, motion, intensity, darkness) {
    const wind = Math.sin(motion * 0.16) * 13 + Math.sin(motion * 0.057) * 9;
    for (const [i, flake] of world.seasonEffects.snow.entries()) {
      if (i / world.seasonEffects.snow.length > intensity) continue;
      const age = motion * flake.speed;
      const x = wrap(flake.x + motion * flake.drift + Math.sin(motion * 0.8 + flake.phase) * (5 + flake.size * 12)
        + wind * Math.sin(motion * 0.24 + flake.phase), W + 48) - 24;
      const y = wrap(flake.y + age + Math.sin(motion * 1.3 + flake.phase) * 4, H + 24) - 12;
      ctx.globalAlpha = mix(0.3, 0.87, flake.size) * (1 - darkness * 0.28);
      pixels(ctx, flake.size > 0.72 ? '#edf3f6' : '#bcd0e2', x, y, flake.size > 0.82 ? 2 : 1);
      if (flake.size > 0.96) {
        pixels(ctx, '#edf3f6', x + 1, y - 1, 1, 3);
        pixels(ctx, '#edf3f6', x, y, 3);
      }
    }
    ctx.globalAlpha = 1;
  }

  function updateFootprints(world, actors, motion) {
    if (season !== 'winter') return;
    const effects = world.seasonEffects;
    const elapsed = motion - effects.lastMotion;
    effects.lastMotion = motion;
    if (elapsed <= 0 || elapsed > 0.3) return;
    for (const actor of actors) {
      if (!actor.moving || actor.alpha < 0.3 || actor.kind === 'fire') continue;
      const id = [actor.kind, actor.home?.seed || '', actor.offset || 0].join('/');
      const previous = effects.previous.get(id);
      const distance = previous ? Math.hypot(actor.x - previous.x, actor.y - previous.y) : Infinity;
      if (distance < 2.3) continue;
      if (distance < 9) {
        effects.footprints.push({ x: actor.x, y: actor.y, born: motion,
          person: actor.kind === 'person', step: previous.step ^ 1, direction: actor.direction });
      }
      effects.previous.set(id, { x: actor.x, y: actor.y, step: previous ? previous.step ^ 1 : 0 });
    }
    const lifetime = 115 / (1 + weather.rain * 2.2);
    effects.footprints = effects.footprints.filter(mark => motion - mark.born < lifetime).slice(-2200);
  }

  function drawFootprints(g, world, motion) {
    if (season !== 'winter') return;
    const lifetime = 115 / (1 + weather.rain * 2.2);
    for (const mark of world.seasonEffects.footprints) {
      const fade = 1 - (motion - mark.born) / lifetime;
      g.globalAlpha = clamp(fade) * 0.47;
      const side = mark.step ? 1 : -1;
      pixels(g, '#617f9a', mark.x, mark.y + side, mark.person ? 1 : 2, mark.person ? 2 : 1);
      if (!mark.person) pixels(g, '#839fb5', mark.x - mark.direction * 2, mark.y - side);
    }
    g.globalAlpha = 1;
  }

  function drawChimneySmoke(world, motion, hour) {
    if (season !== 'winter' && !(season === 'autumn' && (hour < 9 || hour > 18))) return;
    for (const house of world.houses) {
      if (!houseStyles[house.style].chimney) continue;
      const d = dimensions(house);
      const localX = house.view === 'side' ? d.right - 8 : d.peak + Math.round(d.depth * 0.68) + 2;
      const x = house.x + localX * house.face;
      const y = house.y - d.wall - d.roof - d.rise - 7;
      for (let puff = 0; puff < 4; puff++) {
        const age = wrap(motion * 0.13 + puff * 0.25 + house.seed % 13, 1);
        ctx.globalAlpha = (1 - age) * 0.15;
        ellipse(ctx, '#aab5c3', x + age * 13 + Math.sin(age * 6) * 2, y - age * 17,
          1 + age * 4, 1 + age * 2);
      }
    }
    ctx.globalAlpha = 1;
  }

  function measureWalk(points) {
    const lengths = [0];
    for (let i = 1; i < points.length; i++) {
      lengths.push(lengths[i - 1] + Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y));
    }
    return { points, lengths, distance: lengths[lengths.length - 1] };
  }

  function walkPosition(walk, progress) {
    const distance = clamp(progress) * walk.distance;
    let i = walk.lengths.findIndex(length => length > distance);
    if (i < 1) i = walk.points.length - 1;
    const a = walk.points[i - 1] || walk.points[0];
    const b = walk.points[i] || a;
    const segment = walk.lengths[i] - (walk.lengths[i - 1] || 0);
    const t = segment > 0 ? clamp((distance - walk.lengths[i - 1]) / segment) : 0;
    return { x: mix(a.x, b.x, t), y: mix(a.y, b.y, t), direction: b.x >= a.x ? 1 : -1 };
  }

  function villageWalk(world, from, to) {
    const key = p => p.x + ',' + p.y;
    const graph = new Map();
    for (const route of world.paths.routes) {
      const a = key(route[0]);
      const b = key(route[route.length - 1]);
      const distance = measureWalk(route).distance;
      if (!graph.has(a)) graph.set(a, []);
      if (!graph.has(b)) graph.set(b, []);
      graph.get(a).push({ end: b, route, distance });
      graph.get(b).push({ end: a, route: route.slice().reverse(), distance });
    }
    const start = key(from.kind === 'house' ? houseDoor(from) : from);
    const end = key(to.kind === 'house' ? houseDoor(to) : to);
    const costs = new Map([[start, 0]]);
    const parents = new Map();
    const open = new Set([start]);
    while (open.size) {
      let current;
      let cost = Infinity;
      for (const node of open) if (costs.get(node) < cost) { current = node; cost = costs.get(node); }
      if (current === end) break;
      open.delete(current);
      for (const edge of graph.get(current) || []) {
        const candidate = cost + edge.distance;
        if (candidate >= (costs.get(edge.end) ?? Infinity)) continue;
        costs.set(edge.end, candidate);
        parents.set(edge.end, { from: current, route: edge.route });
        open.add(edge.end);
      }
    }
    const pieces = [];
    let node = end;
    while (node !== start && parents.has(node)) {
      const step = parents.get(node);
      pieces.unshift(step.route);
      node = step.from;
    }
    if (node !== start) return null;
    return measureWalk(pieces.flatMap((route, i) => i ? route.slice(1) : route));
  }

  function clearGround(world, x, y, padding = 2) {
    return x > 3 && x < W - 3 && y > world.fringe(x) + 2 && y < H - 3 &&
      !world.houses.some(h => {
        const d = dimensions(h);
        return Math.abs(x - h.x) < (d.front + d.depth) * 0.5 + padding && y > h.y - d.rise - 5 - padding && y < h.y + 4 + padding;
      }) && !world.gardens.some(g => x > g.left - padding && x < g.right + padding && y > g.top - padding && y < g.bottom + padding) &&
      !world.items.some(item => item.kind === 'rock' && item.size > 6 &&
        Math.hypot(x - item.x, (y - item.y) * 1.7) < item.size * 0.65 + padding);
  }

  function clearSegment(world, a, b, padding = 2) {
    const steps = Math.ceil(Math.hypot(a.x - b.x, a.y - b.y) / 2);
    for (let i = 0; i <= steps; i++) {
      if (!clearGround(world, mix(a.x, b.x, i / Math.max(1, steps)), mix(a.y, b.y, i / Math.max(1, steps)), padding)) return false;
    }
    return true;
  }

  function createGroundPopulation(world) {
    const random = randomFrom(hash(world.code + '/жители'));
    const homes = world.houses.filter(h => h.style !== 'shed');
    const people = [];
    const shirts = ['#a75d52', '#638b9c', '#cfad68', '#7b8c60', '#a58ab3', '#c3bda0'];
    function person(home, walk, activity, offset) {
      if (!walk || walk.distance < 1) return;
      people.push({ home, walk, activity, offset, speed: between(random, 4.5, 6.8),
        shirt: pick(random, shirts), hair: pick(random, ['#554331', '#bba274', '#4b4142', '#9b8272']),
        skin: pick(random, ['#ddb58d', '#bc8c6d', '#eac7a0']), duration: between(random, 16, 28) });
    }
    for (const [index, home] of homes.entries()) {
      const garden = world.gardens.find(g => g.owner === home.seed);
      if (garden) {
        const door = houseDoor(home);
        const gateX = garden.side > 0 ? garden.left : garden.right;
        const gateY = Math.round((garden.top + garden.bottom) / 2);
        const outside = gateX - garden.side * 4;
        const walk = measureWalk([door, { x: door.x, y: garden.bottom + 5 },
          { x: outside, y: garden.bottom + 5 }, { x: outside, y: gateY },
          { x: gateX + garden.side * 4, y: gateY }]);
        person(home, walk, 'dig', between(random, 0, 60));
      } else {
        const other = homes[(index + 1 + integer(random, 0, homes.length - 2)) % homes.length];
        person(home, villageWalk(world, home, other), 'visit', between(random, 0, 100));
      }
    }
    if (homes.length >= 2) {
      const route = villageWalk(world, homes[0], homes[1]);
      if (route && route.points.length > 8) {
        const split = Math.floor(route.points.length * 0.5);
        const middle = route.points[split];
        const first = measureWalk(route.points.slice(0, split + 1));
        const second = measureWalk(route.points.slice(split).reverse());
        const offset = between(random, 25, 55);
        person(homes[0], first, 'talk', offset);
        person(homes[1], second, 'talk', offset);
        const pair = people.slice(-2);
        const travel = Math.max(...pair.map(p => p.walk.distance / p.speed));
        pair.forEach((p, i) => {
          p.travel = travel;
          p.duration = 19;
          p.meeting = { x: middle.x + (i ? 3 : -3), y: middle.y + (i ? 1 : 0) };
          p.partnerSide = i ? -1 : 1;
        });
      }
    }
    const pets = [];
    for (const home of homes) {
      for (const kind of ['cat', 'dog']) {
        if (random() > (kind === 'cat' ? 0.76 : 0.61)) continue;
        const door = houseDoor(home);
        const points = [{ x: door.x, y: door.y + 5 }];
        for (let attempt = 0; points.length < 6 && attempt < 80; attempt++) {
          const candidate = { x: home.x + between(random, -24, 24), y: home.y + between(random, 8, 23) };
          if (clearSegment(world, points[points.length - 1], candidate)) points.push(candidate);
        }
        if (points.length < 2) continue;
        const walk = measureWalk(points.concat(points.slice(0, -1).reverse()));
        pets.push({ kind, home, walk, offset: between(random, 0, 40), speed: kind === 'cat' ? 4 : 5.5,
          coat: pick(random, kind === 'cat' ? ['#bd8756', '#d2c8ad', '#6b6a6a', '#45484a'] : ['#a47a50', '#d0ba8d', '#656462']),
          patch: pick(random, ['#e5d3ad', '#514b43', '#a5815a']) });
      }
    }
    const exits = world.paths.routes.flatMap(route => [route[0], route[route.length - 1]])
      .filter(point => point.x < 12 || point.x > W - 12 || point.y > H - 5);
    for (const [index, dog] of pets.filter(pet => pet.kind === 'dog').entries()) {
      dog.nightRole = index % 5 === 4 ? 'patrol' : index % 2 === 0 ? 'sleep' : 'away';
      dog.sleepSpot = dog.walk.points[0];
      if (dog.nightRole !== 'away') continue;
      const exit = exits.slice().sort((a, b) => Math.hypot(a.x - dog.home.x, a.y - dog.home.y) -
        Math.hypot(b.x - dog.home.x, b.y - dog.home.y))[0];
      dog.nightWalk = exit ? villageWalk(world, dog.home, exit) : null;
      if (!dog.nightWalk) dog.nightRole = 'sleep';
    }
    const wildlife = [];
    const species = ['hare', 'fox', 'wolf', 'deer', 'bear'];
    for (const [index, kind] of species.entries()) {
      const routes = [];
      for (let attempt = 0; routes.length < 4 && attempt < 240; attempt++) {
        const side = pick(random, [-1, 1]);
        const y = between(random, 169, 252);
        const a = { x: side < 0 ? between(random, 8, 24) : between(random, W - 24, W - 8), y };
        const b = { x: side < 0 ? between(random, 42, 95) : between(random, W - 95, W - 42), y: y + between(random, -17, 17) };
        const away = p => world.houses.every(h => Math.hypot(p.x - h.x, (p.y - h.y) * 1.3) > 43);
        if (!away(a) || !away(b) || !clearSegment(world, a, b, kind === 'bear' ? 6 : 3)) continue;
        const middle = { x: mix(a.x, b.x, 0.54), y: mix(a.y, b.y, 0.54) };
        routes.push(measureWalk([a, middle, b, middle, a]));
      }
      if (routes.length) wildlife.push({ kind, routes, offset: between(random, 0, 90) + index * 19,
        interval: kind === 'hare' ? 32 : kind === 'bear' ? 112 : kind === 'deer' ? 84 : 61,
        speed: { hare: 13, fox: 10, wolf: 12, deer: 6, bear: 3.8 }[kind] });
    }
    const camp = createCamp(world, homes, people);
    return { people, pets, wildlife, camp };
  }

  function createCamp(world, homes, people) {
    const random = randomFrom(hash(world.code + '/костёр'));
    let selected;
    let best = -Infinity;
    for (const route of world.paths.routes) {
      const start = route[0];
      const source = world.houses.find(h => {
        const door = houseDoor(h);
        return door.x === start.x && door.y === start.y;
      });
      const end = route[route.length - 1];
      if (!source || !(end.x < 12 || end.x > W - 12 || end.y > H - 5)) continue;
      for (let i = 4; i < route.length - 4; i += 3) {
        const p = route[i];
        if (p.x < 28 || p.x > W - 28 || p.y < 178 || p.y > 258) continue;
        for (const [dx, dy] of [[0, -10], [0, 10], [-12, 0], [12, 0]]) {
          const center = { x: p.x + dx, y: p.y + dy };
          if (Math.min(center.x, W - center.x) > 110 || center.x < 35 || center.x > W - 35 || center.y > 259) continue;
          if (!clearSegment(world, p, center, 5)) continue;
          if (![-9, 0, 9].every(dx => [-6, 0, 7].every(dy => clearGround(world, center.x + dx, center.y + dy, 4)))) continue;
          const distance = Math.min(...world.houses.map(h => Math.hypot(center.x - h.x, (center.y - h.y) * 1.3)));
          if (distance < 32) continue;
          const edge = Math.min(center.x, W - center.x);
          const trees = world.items.filter(item => (item.kind === 'pine' || item.kind === 'leaf') &&
            Math.hypot(item.x - center.x, item.y - center.y) < 55).length;
          const score = distance * 0.5 - edge * 0.25 + trees * 3 + random() * 5;
          if (score > best) {
            best = score;
            selected = { ...center, source, approach: route.slice(0, i + 1) };
          }
        }
      }
    }
    if (!selected) return null;
    const { x, y, source, approach } = selected;
    const guests = homes.slice().sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y)).slice(0, 3);
    const seats = [[-8, 2], [8, 3], [0, -7]];
    const members = guests.map((home, i) => {
      const start = home === source ? [houseDoor(home)] : villageWalk(world, home, source)?.points;
      if (!start) return null;
      const seat = { x: x + seats[i][0], y: y + seats[i][1] };
      const walk = measureWalk([...start, ...approach.slice(1), { x, y: y + 9 }, seat]);
      const resident = people.find(p => p.home === home);
      return { ...resident, kind: 'person', home, walk, seat, offset: i * 2.7,
        arrival: 1.42 + i * 0.17, departure: 4.97 + i * 0.13,
        returnDuration: clamp(walk.distance / 100, 0.8, 1.95),
        shirt: resident?.shirt || pick(random, ['#b17860', '#799185', '#a28bba']),
        skin: resident?.skin || '#d6ae88', hair: resident?.hair || '#6b5141' };
    }).filter(Boolean);
    // Leave a small clearing so the seated group remains visible between the trees.
    world.items = world.items.filter(item => {
      if (item.kind !== 'pine' && item.kind !== 'leaf' && item.kind !== 'bush') return true;
      const reach = item.width ? item.width * 0.46 : item.size;
      const top = item.y - (item.height || item.size);
      return !(Math.abs(item.x - x) < reach + 17 && item.y > y - 9 && top < y + 9);
    });
    return { x, y, members };
  }

  function campState(camp, hour) {
    if (!camp || season === 'winter') return null;
    const age = wrap(hour - 20.5, 24);
    if (age > 7.3) return null;
    const flame = smooth((age - 1.48) / 0.24) * (1 - smooth((age - 4.35) / 0.48));
    const embers = smooth((age - 1.48) / 0.18) * (1 - smooth((age - 4.75) / 0.72));
    return { age, flame, embers, heat: Math.max(flame, embers * 0.19) };
  }

  function campPopulation(camp, hour) {
    const state = campState(camp, hour);
    if (!state) return [];
    const { age, flame, embers } = state;
    const actors = [];
    if (age > 1.42 && age < 6.3) actors.push({ kind: 'fire', x: camp.x, y: camp.y, flame, embers, alpha: 1 });
    for (const member of camp.members) {
      const leave = member.departure;
      const start = 0.12 + member.offset / 22;
      const end = leave + member.returnDuration;
      if (age < start || age > end) continue;
      const seated = age >= member.arrival && age < leave;
      const progress = age < member.arrival ? (age - start) / (member.arrival - start)
        : age < leave ? 1 : 1 - (age - leave) / member.returnDuration;
      const position = walkPosition(member.walk, progress);
      if (age >= leave) position.direction *= -1;
      if (seated) Object.assign(position, member.seat, { direction: camp.x >= member.seat.x ? 1 : -1 });
      actors.push({ ...member, ...position, seated, moving: !seated, working: seated,
        alpha: smooth((age - start) / 0.07) * smooth((end - age) / 0.07) });
    }
    return actors;
  }

  function groundPopulation(world, motion, hour) {
    const actors = campPopulation(world.population.camp, hour);
    const awayAtCamp = new Set(actors.filter(actor => actor.kind === 'person').map(actor => actor.home));
    const daylight = smooth((hour - 5) / 1.5) * smooth((21.4 - hour) / 1.6);
    for (const person of world.population.people) {
      if (awayAtCamp.has(person.home)) continue;
      const clearingSnow = season === 'winter' && person.activity === 'dig';
      const door = clearingSnow ? houseDoor(person.home) : null;
      const walk = clearingSnow ? measureWalk([door, { x: door.x + 7, y: door.y + 9 }]) : person.walk;
      const travel = clearingSnow ? walk.distance / 3 : person.travel || walk.distance / person.speed;
      const outside = person.duration * (season === 'winter' && person.activity === 'talk' ? 0.45 : 1);
      const age = wrap(motion + person.offset, travel * 2 + outside + 18);
      if (age < 9 || age > travel * 2 + outside + 9 || daylight < 0.02) continue;
      const elapsed = age - 9;
      const working = elapsed >= travel && elapsed < travel + outside;
      if (working && person.activity === 'visit') continue;
      const returning = elapsed >= travel + outside;
      const progress = returning ? 1 - (elapsed - travel - outside) / travel : Math.min(1, elapsed / travel);
      const position = walkPosition(walk, progress);
      if (returning) position.direction *= -1;
      if (working && person.meeting) Object.assign(position, person.meeting, { direction: person.partnerSide });
      const fade = smooth(elapsed / 1.1) * smooth((travel * 2 + outside - elapsed) / 1.1);
      actors.push({ ...person, ...position, kind: 'person', moving: !working, working,
        activity: clearingSnow ? 'shovel' : person.activity, alpha: daylight * fade });
    }
    for (const pet of world.population.pets) {
      const travel = pet.walk.distance / pet.speed;
      const age = wrap(motion + pet.offset, travel + 13);
      const position = walkPosition(pet.walk, Math.min(1, age / travel));
      if (pet.kind === 'dog') {
        const dog = nightDog(pet, position, motion, hour, age < travel);
        if (dog) actors.push(dog);
        continue;
      }
      actors.push({ ...pet, ...position, moving: age < travel, alpha: mix(0.55, 1, daylight) });
    }
    for (const animal of world.population.wildlife) {
      if (season === 'winter' && animal.kind === 'bear') continue;
      const cycle = Math.floor((motion + animal.offset) / animal.interval);
      const age = wrap(motion + animal.offset, animal.interval);
      const route = animal.routes[cycle % animal.routes.length];
      const duration = Math.min(animal.interval * 0.72, route.distance / animal.speed);
      if (age > duration) continue;
      const progress = age / duration;
      const grazing = animal.kind === 'deer' && progress > 0.4 && progress < 0.6;
      const distance = animal.kind === 'deer' ? (progress < 0.4 ? progress * 1.25
        : progress < 0.6 ? 0.5 : 0.5 + (progress - 0.6) * 1.25) : progress;
      const p = walkPosition(route, distance);
      const fade = smooth(age / 2.5) * smooth((duration - age) / 2.5);
      actors.push({ ...animal, ...p, moving: !grazing, alpha: fade, wild: true,
        coat: animal.kind === 'hare' && season === 'winter' ? '#e1e1d5' :
          { hare: '#bdbaa4', fox: '#c88648', wolf: '#898e90', deer: '#b4956b', bear: '#80664d' }[animal.kind],
        patch: animal.kind === 'fox' ? '#e3d1ae' : '#c6bda5' });
    }
    if (season === 'autumn') actors.push(...fallingLeaves(world, motion));
    return actors.sort((a, b) => a.y - b.y);
  }

  function nightDog(dog, dayPosition, motion, hour, dayMoving) {
    const age = wrap(hour - 19.5, 24);
    if (age > 12) return { ...dog, ...dayPosition, moving: dayMoving, alpha: 1 };
    const night = smooth(age / 1.3) * (1 - smooth((age - 10.3) / 1.2));
    if (dog.nightRole === 'away') {
      const returning = age >= 9.7;
      if (age > 2.4 && !returning) return null;
      const progress = returning ? 1 - clamp((age - 9.7) / 1.7) : clamp(age / 2.4);
      const position = walkPosition(dog.nightWalk, progress);
      if (returning) position.direction *= -1;
      const transition = returning ? 1 - smooth((age - 11.4) / 0.6) : smooth(age / 0.35);
      const alpha = 1 - smooth((progress - 0.91) / 0.09);
      if (alpha < 0.01) return null;
      return { ...dog, ...position, x: mix(dayPosition.x, position.x, transition),
        y: mix(dayPosition.y, position.y, transition), moving: true, alpha };
    }
    if (dog.nightRole === 'patrol') {
      const patrolTravel = dog.walk.distance / 2.1;
      const phase = wrap(motion + dog.offset, patrolTravel + 72);
      const position = walkPosition(dog.walk, Math.min(1, phase / patrolTravel));
      const sleeping = night > 0.7 && phase >= patrolTravel;
      return { ...dog, ...position, x: mix(dayPosition.x, position.x, night),
        y: mix(dayPosition.y, position.y, night), moving: night > 0.7 ? !sleeping : dayMoving,
        sleeping, alpha: 1 };
    }
    return { ...dog, ...dayPosition, x: mix(dayPosition.x, dog.sleepSpot.x, night),
      y: mix(dayPosition.y, dog.sleepSpot.y, night), direction: night > 0.7 ? dog.home.face : dayPosition.direction,
      moving: night < 0.7 && dayMoving,
      sleeping: night > 0.7, alpha: 1 };
  }

  function drawGroundActor(g, actor, motion) {
    if (actor.alpha < 0.01) return;
    if (actor.kind === 'leafParticle') {
      g.globalAlpha = actor.alpha;
      pixels(g, actor.color, actor.x, actor.leafY, actor.wide ? 2 : 1);
      g.globalAlpha = 1;
      return;
    }
    if (actor.kind === 'fire') {
      drawCampfire(g, actor, motion);
      return;
    }
    const scale = mix(0.58, 1.02, clamp((actor.y - 151) / 110));
    const stride = actor.moving ? Math.sin(motion * (actor.kind === 'hare' ? 15 : 9) + actor.offset) : 0;
    const hop = actor.kind === 'hare' ? Math.max(0, stride) * 3 : 0;
    g.save();
    g.globalAlpha = actor.alpha * 0.26;
    ellipse(g, '#172b2a', actor.x + 1, actor.y, (actor.kind === 'bear' ? 7 : 4) * scale, scale * 1.3);
    g.globalAlpha = actor.alpha;
    g.translate(Math.round(actor.x), Math.round(actor.y));
    g.scale(actor.direction * scale, scale);
    if (actor.kind === 'dog' && actor.sleeping) {
      ellipse(g, actor.coat, 0, -2, 4, 2);
      pixels(g, actor.patch, -2, -2, 3, 2);
      ellipse(g, actor.coat, 3, -1, 2, 1);
      pixels(g, '#423c38', 3, -1, 2);
      pixels(g, actor.coat, 2, -3, 2, 2);
      trace(g, actor.coat, -3, -1, -5, -2);
      const twitch = wrap(motion + actor.offset, 17) < 0.2 ? 1 : 0;
      pixels(g, actor.patch, 0, twitch, 3);
      g.restore();
      return;
    }
    if (actor.kind === 'person') {
      if (actor.seated) {
        pixels(g, '#62503e', -4, -2, 7, 2);
        pixels(g, '#423c37', -3, 0, 2);
        trace(g, '#444953', 0, -3, 4, -3);
        trace(g, '#353e49', 4, -3, 5, 0);
        pixels(g, actor.shirt, -2, -8, 4, 5);
        pixels(g, actor.skin, -1, -11, 3, 3);
        pixels(g, actor.hair, -1, -12, 3, 2);
        const gesture = Math.sin(motion * 1.8 + actor.offset) > 0.4 ? -1 : 1;
        trace(g, actor.shirt, 0, -6, 3, -5 + gesture);
        pixels(g, actor.skin, 3, -5 + gesture);
        g.restore();
        return;
      }
      const digging = actor.working && (actor.activity === 'dig' || actor.activity === 'shovel');
      const bend = digging ? (Math.sin(motion * 4) + 1) * 0.8 : 0;
      trace(g, '#444953', -1, -4, -2 + stride, 0);
      trace(g, '#353e49', 1, -4, 2 - stride, 0);
      pixels(g, '#3b3936', -3 + stride, 0, 2);
      pixels(g, '#3b3936', 1 - stride, 0, 2);
      pixels(g, actor.shirt, -2 + bend, -9 + bend, 5, 6);
      pixels(g, actor.skin, -1 + bend, -12 + bend, 4, 4);
      pixels(g, actor.hair, -1 + bend, -13 + bend, 4, 2);
      if (season === 'winter') {
        pixels(g, actor.shirt, -2 + bend, -14 + bend, 5, 2);
        pixels(g, '#d9a976', -1 + bend, -8 + bend, 4);
        pixels(g, '#d9a976', 2 + bend, -7 + bend, 1, 3);
      }
      pixels(g, '#514943', 2 + bend, -10 + bend);
      const arm = digging ? 2 + bend : actor.working ? Math.sin(motion * 2 + actor.offset) * 1.3 : stride;
      trace(g, actor.shirt, 1 + bend, -8 + bend, 4, -6 + arm);
      pixels(g, actor.skin, 4, -6 + arm);
      if (digging) {
        trace(g, '#b99c6e', 4, -8 + bend, 7 - bend, -1);
        pixels(g, '#7d898a', 6 - bend, -1, 3, 2);
        if (Math.sin(motion * 4) > 0.7) pixels(g, actor.activity === 'shovel' ? '#d8e4ed' : '#746040', 8, -2, 2);
      }
    } else {
      const kind = actor.kind;
      const large = kind === 'bear' || kind === 'deer';
      const body = kind === 'bear' ? 10 : kind === 'deer' ? 9 : kind === 'hare' ? 5 : 7;
      const height = kind === 'bear' ? 6 : kind === 'hare' ? 4 : 4;
      const legs = kind === 'deer' ? 6 : large ? 3 : 2;
      const base = -legs - hop;
      for (const x of [-body / 2 + 1, body / 2 - 1]) {
        trace(g, actor.coat, x, base, x + stride * (large ? 1 : 1.5), -hop);
        trace(g, actor.patch, x + 1, base, x - stride, -hop);
      }
      ellipse(g, actor.coat, 0, base - height * 0.45, body * 0.64, height * 0.69);
      if (kind === 'deer') {
        polygon(g, actor.coat, [[2, base - 2], [4, base - 9], [7, base - 10], [6, base], [3, base]]);
        ellipse(g, actor.coat, 6, base - 9, 3, 2);
        trace(g, '#c8ba93', 5, base - 10, 3, base - 15);
        trace(g, '#c8ba93', 3, base - 13, 1, base - 14);
        trace(g, '#c8ba93', 6, base - 11, 8, base - 15);
        trace(g, '#c8ba93', 7, base - 13, 9, base - 14);
        pixels(g, '#303a36', 8, base - 9);
      } else {
        const head = body * 0.52;
        ellipse(g, actor.coat, head, base - height, kind === 'bear' ? 3 : 2, 2);
        pixels(g, actor.patch, head + 1, base - height + 1, kind === 'wolf' ? 3 : 2);
        pixels(g, '#333931', head + (kind === 'wolf' ? 3 : 2), base - height);
        const ear = kind === 'hare' ? 5 : kind === 'bear' ? 2 : 3;
        pixels(g, actor.coat, head - 1, base - height - ear, 1, ear);
        pixels(g, actor.coat, head + 1, base - height - ear + 1, 1, ear);
        if (kind === 'cat') {
          trace(g, actor.coat, -4, base - 1, -6, base - 5);
          trace(g, actor.coat, -6, base - 5, -5, base - 7);
          pixels(g, actor.patch, -1, base - 3, 2, 2);
        } else if (kind !== 'bear' && kind !== 'hare') {
          const tailY = base + (kind === 'dog' ? -3 + Math.sin(motion * 8) : 0);
          trace(g, actor.coat, -4, base - 2, -9, tailY, kind === 'fox' ? 2 : 1);
          pixels(g, actor.patch, -10, tailY, 2);
        }
        if (kind === 'hare') pixels(g, actor.patch, -4, base - 2, 2, 2);
      }
    }
    g.restore();
  }

  function drawCampfire(g, fire, motion) {
    const { x, y, flame, embers } = fire;
    ellipse(g, '#303434', x, y, 6, 2);
    for (const [dx, dy] of [[-5, 0], [-3, 2], [1, 2], [5, 0], [2, -2], [-2, -2]]) {
      pixels(g, '#77786e', x + dx, y + dy, 2);
    }
    trace(g, '#72503a', x - 3, y - 1, x + 3, y + 1, 2);
    trace(g, '#503d32', x - 3, y + 1, x + 3, y - 1, 2);
    if (embers > 0) {
      g.globalAlpha = embers * (0.65 + Math.sin(motion * 5) * 0.12);
      pixels(g, '#e37936', x - 2, y - 1, 4, 2);
      pixels(g, '#f1b65a', x, y - 1);
      g.globalAlpha = 1;
    }
    if (flame < 0.01) return;
    for (let tongue = 0; tongue < 3; tongue++) {
      const dx = tongue * 2 - 2;
      const wave = Math.sin(motion * (9 + tongue * 3) + tongue * 2);
      const height = (5 + (wave + 1) * 2 + (tongue === 1 ? 3 : 0)) * flame;
      polygon(g, '#e67d35', [[x + dx - 2, y], [x + dx - 1, y - height * 0.44],
        [x + dx + wave, y - height], [x + dx + 1, y - height * 0.5], [x + dx + 2, y]]);
      polygon(g, '#ffd080', [[x + dx - 1, y], [x + dx, y - height * 0.68], [x + dx + 1, y]]);
    }
    pixels(g, '#fff0b8', x - 1, y - 2, 3, 2);
    for (let spark = 0; spark < 3; spark++) {
      const age = wrap(motion * 0.65 + spark * 0.31, 1);
      g.globalAlpha = (1 - age) * flame * 0.7;
      pixels(g, '#f0c985', x + Math.sin(motion + spark) * 3, y - 5 - age * 14);
    }
    g.globalAlpha = 1;
  }

  const flyingSpecies = {
    gull: { count: [1, 2], speed: 13, size: 1, flap: 2.3, body: '#e9e5d1', wing: '#c3c9c7', tip: '#384650', belly: '#faf0d4', beak: '#d8aa55' },
    pigeon: { count: [3, 5], speed: 20, size: 0.86, flap: 5.2, body: '#8a95a8', wing: '#606e85', tip: '#364253', belly: '#c6bbc1', beak: '#c5b6a0' },
    stork: { count: [1, 2], speed: 10, size: 1.35, flap: 1.6, body: '#f3e6cb', wing: '#dad9c8', tip: '#2e3941', belly: '#fff1d5', beak: '#dc7854' },
    tit: { count: [3, 5], speed: 23, size: 0.72, flap: 7.1, body: '#d7bd50', wing: '#668e9a', tip: '#344a54', belly: '#f7dc6a', beak: '#353d3e' },
    sparrow: { count: [3, 5], speed: 21, size: 0.72, flap: 6.6, body: '#ac8059', wing: '#896344', tip: '#544a3e', belly: '#d9c298', beak: '#d5ad6b' },
    owl: { count: [1, 2], speed: 11, size: 1.13, flap: 2.2, night: true, body: '#897b6b', wing: '#72685e', tip: '#4a4850', belly: '#c1ac87', beak: '#ceac72' },
    littleOwl: { count: [1, 2], speed: 15, size: 0.81, flap: 3.5, night: true, body: '#9b8c75', wing: '#7d7565', tip: '#514e50', belly: '#c4ba98', beak: '#c4ae79' },
    eagleOwl: { count: [1, 2], speed: 9, size: 1.4, flap: 1.8, night: true, body: '#99816b', wing: '#796753', tip: '#484650', belly: '#bfa37c', beak: '#bd9c69' },
    bat: { count: [3, 5], speed: 21, size: 0.86, flap: 9, night: true, body: '#4e4358', wing: '#5f516e', tip: '#2b2d42', belly: '#8a7382', beak: '#4e4358' }
  };

  function createFlocks(code) {
    const random = randomFrom(hash(code + '/птицы'));
    return Object.keys(flyingSpecies).concat(['bat']).map((species, index) => {
      const type = flyingSpecies[species];
      const count = type.night && species !== 'bat' ? (random() < 0.8 ? 1 : 2)
        : integer(random, ...type.count);
      return { species, seed: integer(random, 1, 2 ** 30), offset: between(random, 0, 60) + index * 7,
        members: Array.from({ length: count }, (_, member) => ({
          phase: between(random, 0, Math.PI * 2), pace: between(random, 0.76, 1.27),
          size: between(random, 0.83, 1.13), rank: member - (count - 1) / 2,
          eyePeriod: between(random, 7, 14), eyeOffset: between(random, 0, 14)
        })) };
    });
  }

  function flockFlight(flock, motion) {
    const type = flyingSpecies[flock.species];
    const crossing = (W + 156) / type.speed;
    const period = crossing + 9;
    const elapsed = motion + flock.offset;
    const cycle = Math.floor(elapsed / period);
    const age = wrap(elapsed, period);
    const random = randomFrom(flock.seed ^ Math.imul(cycle + 1, 2654435761));
    const direction = random() < 0.5 ? -1 : 1;
    const altitude = between(random, 27, 89);
    const slope = between(random, -0.035, 0.035);
    const distance = age * type.speed;
    const x = direction > 0 ? -78 + distance : W + 78 - distance;
    const y = altitude + slope * (distance - W / 2) + Math.sin(age * 0.17) * 7;
    return { x, y, direction, age, visible: age < crossing, depth: between(random, 0.82, 1.17) };
  }

  function memberFlight(flock, member, flight, motion) {
    const type = flyingSpecies[flock.species];
    const t = motion * member.pace;
    const phase = member.phase;
    const bat = flock.species === 'bat';
    const small = type.count[0] >= 3;
    const forward = member.rank * (small ? 8 : 17) + Math.sin(t * (bat ? 1.62 : 0.67) + phase) * (small ? 13 : 3)
      + Math.sin(t * 1.87 + phase * 2) * (bat ? 8 : small ? 3 : 0.8);
    const flutter = Math.sin(t * (bat ? 2.8 : 1.13) + phase) * (bat ? 8 : small ? 4 : 1.4);
    const dive = bat ? Math.sin(t * 0.9 + phase) * Math.abs(Math.sin(t * 0.9 + phase)) * 13 : 0;
    const y = flight.y + member.rank * (small ? 2.4 : 5) + flutter + dive;
    const dx = flight.direction * (type.speed + member.pace *
      (Math.cos(t * (bat ? 1.62 : 0.67) + phase) * (small ? 13 : 3) * (bat ? 1.62 : 0.67)
        + Math.cos(t * 1.87 + phase * 2) * (bat ? 8 : small ? 3 : 0.8) * 1.87));
    return { x: flight.x + forward * flight.direction, y,
      direction: bat && Math.abs(dx) > 4 ? Math.sign(dx) : flight.direction,
      bank: clamp(Math.cos(t * (bat ? 2.8 : 1.13) + phase) * (bat ? 1 : 0.3), -1, 1),
      scale: type.size * member.size * flight.depth };
  }

  function birdColors(type, sun, moon, fog) {
    const light = moon.darkness;
    const tint = sun.active ? sun.color : [128, 155, 204];
    const warmth = sun.active ? (1 - sun.elevation) * sun.direct * 0.19 : 0;
    const shades = {};
    for (const key of ['body', 'wing', 'tip', 'belly', 'beak']) {
      const dayColor = rgb(type[key]);
      const nightColor = dayColor.map((channel, i) => channel * (0.28 + moon.direct * 0.23) + [9, 13, 27][i]);
      let color = blendRgb(dayColor, nightColor, light);
      color = blendRgb(color, tint, warmth);
      shades[key] = cssColor(blendRgb(color, [120, 137, 148], fog * 0.19));
    }
    return shades;
  }

  function drawFlyingBird(g, species, colors, wing, bank) {
    const stork = species === 'stork';
    const small = species === 'tit' || species === 'sparrow';
    const owl = flyingSpecies[species].night;
    const span = small ? 4 : species === 'gull' ? 7 : stork ? 8 : 6;
    const lift = wing * (small ? 3 : 4.5);
    const wingBase = -1;
    polygon(g, colors.tip, [[-2, wingBase], [-span - 1, -lift + bank * 2],
      [-span + 1, -lift + 2 + bank * 2], [0, 2]]);
    polygon(g, colors.wing, [[-1, -1], [span, -lift - bank * 2],
      [span - 1, -lift + 2 - bank * 2], [1, 2]]);
    trace(g, colors.belly, 0, -1, span - 1, -lift - bank * 2);
    polygon(g, colors.tip, [[-2, 0], [-5, 1], [-6, 3], [-2, 2]]);
    pixels(g, colors.body, -2, 0, 5, 2);
    pixels(g, colors.belly, -1, 2, 3);
    if (stork) {
      trace(g, colors.belly, 2, 0, 5, -2);
      pixels(g, colors.belly, 4, -3, 3, 2);
      pixels(g, colors.beak, 7, -2, 4);
      trace(g, colors.beak, -2, 2, -7, 4);
      trace(g, colors.beak, -3, 2, -8, 3);
    } else {
      pixels(g, colors.body, 2, -2, owl ? 3 : 2, 3);
      pixels(g, colors.beak, owl ? 5 : 4, -1, small ? 1 : 2);
      if (species === 'tit') {
        pixels(g, colors.tip, 2, -2, 2, 2);
        pixels(g, colors.belly, 2, 0);
      }
      if (species === 'pigeon') {
        pixels(g, '#68877f', 1, 0, 2);
        trace(g, colors.tip, span - 3, -lift + 1, span - 2, -lift + 2);
      }
      if (owl) {
        pixels(g, colors.belly, 2, -1, 2, 2);
        pixels(g, colors.tip, 3, -1);
        pixels(g, colors.tip, -1, 1);
        if (species === 'eagleOwl') {
          pixels(g, colors.body, 2, -4, 1, 2);
          pixels(g, colors.body, 4, -3, 1, 2);
        }
      }
    }
  }

  function drawBat(g, colors, wing, bank) {
    const lift = wing * 4.8;
    for (const side of [-1, 1]) {
      const tilt = bank * side * 2;
      polygon(g, colors.tip, [[0, 0], [side * 3, -2], [side * 7, -lift + tilt - 1],
        [side * 6, -lift + tilt + 2], [side * 5, 2 + tilt], [side * 4, 1],
        [side * 3, 4 + tilt], [side * 2, 2], [side, 4]]);
      polygon(g, colors.wing, [[0, 0], [side * 3, -1], [side * 6, -lift + tilt],
        [side * 4, 1 + tilt], [side * 3, 1], [side * 2, 2]]);
      trace(g, colors.belly, side, 0, side * 6, -lift + tilt);
    }
    pixels(g, colors.body, -1, -1, 3, 5);
    pixels(g, colors.body, -1, -3, 1, 2);
    pixels(g, colors.body, 1, -3, 1, 2);
    pixels(g, colors.tip, 0, 3, 1, 2);
  }

  function drawFlocks(world, hour, motion, weather, sun, moon) {
    if (season === 'winter') return;
    const daytime = smooth((hour - 5.4) / 1.2) * smooth((20.3 - hour) / 1.4);
    for (const flock of world.flocks) {
      const type = flyingSpecies[flock.species];
      const presence = type.night ? 1 - daytime : daytime;
      if (presence < 0.02) continue;
      const flight = flockFlight(flock, motion);
      if (!flight.visible) continue;
      const shades = birdColors(type, sun, moon, weather.fog);
      for (const member of flock.members) {
        const pose = memberFlight(flock, member, flight, motion);
        if (pose.x < -22 || pose.x > W + 22) continue;
        const beat = motion * type.flap * Math.PI * 2 + member.phase;
        const glide = type.flap < 3 && Math.sin(motion * 0.47 + member.phase) > 0.35;
        const wing = glide ? 0.15 + Math.sin(motion * 1.1 + member.phase) * 0.15 : Math.sin(beat);
        ctx.save();
        ctx.globalAlpha = presence * (1 - weather.rain * 0.27);
        ctx.translate(Math.round(pose.x), Math.round(pose.y));
        ctx.scale(pose.direction * pose.scale, pose.scale);
        if (flock.species === 'bat') drawBat(ctx, shades, wing, pose.bank);
        else drawFlyingBird(ctx, flock.species, shades, wing, pose.bank);
        if (type.night && flock.species !== 'bat') {
          const blink = wrap(motion + member.eyeOffset, member.eyePeriod);
          if (blink < 0.14 || (blink > 0.31 && blink < 0.39)) {
            ctx.globalAlpha = presence * 0.85;
            pixels(ctx, flock.species === 'eagleOwl' ? '#e9a459' : '#ebd399', 3, -1);
          }
        }
        ctx.restore();
      }
    }
  }

  let world;
  let layers;
  let simulatedMinutes = START_HOUR * 60;
  let motion = 0;
  let paused = false;
  let weather;
  let frame = 0;
  let lastRender = 0;

  const currentWeather = () => weatherAt(world, simulatedMinutes / 60, weatherPicker.value, coverPicker.value);

  function showWeatherNow() {
    weather = currentWeather();
    render();
  }

  function render() {
    if (!world) return;
    const hour = simulatedMinutes / 60;
    const light = lightingAt(hour);
    const clouds = cloudState(world, motion, weather.level);
    const sun = sunlightAt(world, hour, weather, clouds);
    const moon = moonlightAt(world, hour, weather, clouds);
    drawSky(world, light, motion, weather, clouds, sun, moon);
    drawFlocks(world, hour, motion, weather, sun, moon);
    drawLand(world, layers, light, hour, motion, weather, clouds, sun, moon);
    const minutes = Math.floor(simulatedMinutes);
    if (clock.valueAsNumber !== minutes) clock.value = minutes;
    const display = [Math.floor(minutes / 60), minutes % 60].map(value => String(value).padStart(2, '0')).join(':');
    if (byId('time-label').textContent !== display) byId('time-label').textContent = display;
    clock.setAttribute('aria-valuetext', display);
  }

  function tick(now) {
    frame = 0;
    const elapsed = now - lastRender;
    if (elapsed >= 40) {
      const dt = Math.min(elapsed / 1000, 0.15);
      lastRender = now;
      simulatedMinutes = wrap(simulatedMinutes + dt * DAY_MINUTES / DAY_SECONDS, DAY_MINUTES);
      motion += dt;
      const target = currentWeather();
      for (const key of Object.keys(weather)) weather[key] = mix(weather[key], target[key], 1 - Math.exp(-dt * 0.83));
      render();
    }
    startClock();
  }

  function startClock() {
    if (!frame && !paused && !document.hidden) frame = requestAnimationFrame(tick);
  }

  function resetClock() {
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
    lastRender = performance.now();
    startClock();
  }

  function freshCode() {
    return Array.from(crypto.getRandomValues(new Uint32Array(2)),
      value => value.toString(36).padStart(7, '0')).join('-');
  }

  const normalizeCode = value => Array.from(value.trim()).slice(0, 48).join('');

  function codeFromUrl() {
    try {
      return normalizeCode(decodeURIComponent(location.hash.slice(1)));
    } catch {
      return '';
    }
  }

  function selectVillage(code) {
    world = generateWorld(code);
    world.population = createGroundPopulation(world);
    world.flocks = createFlocks(code);
    world.cloudLayers = generateCloudLayers(code);
    const fragment = '#' + encodeURIComponent(code);
    if (location.hash !== fragment) {
      try { history.replaceState(null, '', fragment); }
      catch { location.hash = fragment; }
    }
    seedField.value = code;
    motion = 0;
    rebuildSeason();
    showWeatherNow();
    resetClock();
  }

  function rebuildSeason() {
    seasonalColors = Object.fromEntries(Object.entries(colors).map(([phase, base]) =>
      [phase, seasonalPalette(base, phase)]));
    world.seasonEffects = createSeasonEffects(world);
    world.moonMasks = paintMoonlight(world);
    layers = Object.fromEntries(Object.entries(seasonalColors).map(([phase, palette]) =>
      [phase, paintLand(world, palette)]));
    shadowPosition = -1;
    weatherPicker.querySelector('option[value="rain"]').textContent = season === 'winter' ? 'Снег' : 'Дождь';
  }

  for (const button of document.querySelectorAll('[data-season]')) {
    button.addEventListener('click', () => {
      if (season === button.dataset.season) return;
      season = button.dataset.season;
      for (const option of document.querySelectorAll('[data-season]')) {
        option.setAttribute('aria-pressed', option === button);
      }
      rebuildSeason();
      showWeatherNow();
      resetClock();
    });
  }

  function togglePause() {
    paused = !paused;
    const label = paused ? 'Продолжить' : 'Пауза';
    pauseButton.setAttribute('aria-pressed', paused);
    pauseButton.setAttribute('aria-label', label);
    pauseButton.title = label + ' (пробел)';
    pauseButton.querySelector('.action-label').textContent = label;
    pauseButton.querySelector('.compact-icon').textContent = paused ? '▶' : 'Ⅱ';
    resetClock();
  }

  function openSettings(open) {
    settings.hidden = !open;
    settingsToggle.setAttribute('aria-expanded', open);
  }

  function toggleInterface() {
    ui.hidden = !ui.hidden;
    if (ui.hidden) {
      openSettings(false);
      canvas.focus({ preventScroll: true });
    } else {
      settingsToggle.focus({ preventScroll: true });
    }
  }

  byId('regenerate').addEventListener('click', () => selectVillage(freshCode()));
  byId('seed-form').addEventListener('submit', event => {
    event.preventDefault();
    const code = normalizeCode(seedField.value);
    if (code) selectVillage(code);
  });
  window.addEventListener('hashchange', () => {
    const code = codeFromUrl();
    if (code !== world.code) selectVillage(code || freshCode());
  });

  clock.addEventListener('input', () => {
    simulatedMinutes = clock.valueAsNumber;
    world.seasonEffects.previous.clear();
    showWeatherNow();
  });
  for (const control of [weatherPicker, coverPicker]) {
    control.addEventListener('change', () => {
      if (paused) showWeatherNow();
    });
  }

  settingsToggle.addEventListener('click', () => openSettings(settings.hidden));
  byId('hide-ui').addEventListener('click', toggleInterface);
  canvas.addEventListener('click', () => {
    if (ui.hidden) toggleInterface();
    else openSettings(false);
  });
  pauseButton.addEventListener('click', togglePause);

  if (!document.fullscreenEnabled) fullscreenButton.hidden = true;
  fullscreenButton.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await byId('village').requestFullscreen();
    } catch {
      fullscreenButton.hidden = true;
    }
  });
  document.addEventListener('fullscreenchange', () => {
    const label = document.fullscreenElement ? 'Выйти из полного экрана' : 'На весь экран';
    fullscreenButton.setAttribute('aria-label', label);
    fullscreenButton.querySelector('.action-label').textContent = label;
  });
  document.addEventListener('visibilitychange', resetClock);
  document.addEventListener('keydown', event => {
    if (event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.key === 'Escape') {
      if (ui.hidden) toggleInterface();
      else if (!settings.hidden) {
        openSettings(false);
        settingsToggle.focus();
      }
      return;
    }
    if (event.target.closest('input, select')) return;
    if (event.code === 'Space' && !event.target.closest('button')) {
      event.preventDefault();
      togglePause();
    }
    if (event.code === 'KeyH') toggleInterface();
  });

  selectVillage(codeFromUrl() || freshCode());
})();
</script>
</body>
</html>
