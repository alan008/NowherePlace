    if (depth) {
      polygon(g, hdGradient(g, right, -wall, right + depth, 0, [wood[1], wood[0]]), [[right, -wall], [right + depth, -wall - rise], [right + depth, -rise - 2], [right, -2]]);
      for (let y = -wall + 2; y < -2; y += 2.7) {
        hdLine(g, wood[0], [[right, y], [right + depth, y - rise]], 0.55);
        hdLine(g, wood[2], [[right, y - 0.5], [right + depth, y - rise - 0.5]], 0.27);
      }
      if (depth > 7) {
        const wx = right + depth * 0.45, wy = -wall * 0.68 - rise * 0.45;
        polygon(g, wood[0], [[wx - 1.6, wy - 0.7], [wx + 1.6, wy - rise / depth * 3.2 - 0.7], [wx + 1.6, wy + 3.8 - rise / depth * 3.2], [wx - 1.6, wy + 3.8]]);
        polygon(g, palette.glass, [[wx - 1.1, wy], [wx + 1.1, wy - rise / depth * 2.2], [wx + 1.1, wy + 3 - rise / depth * 2.2], [wx - 1.1, wy + 3]]);
      }
    }
    hdRound(g, hdGradient(g, left, -wall, right, 0, [wood[4], wood[3], wood[2]]), left, -wall, front, wall - 2, 0.4);
    if (!side) polygon(g, hdGradient(g, left, -wall - roof, peak, -wall, [wood[4], wood[2]]), [[left, -wall], [peak, -wall - roof], [right, -wall]]);
    for (let y = -wall + 2; y < -3; y += 2.7) {
      hdLine(g, wood[1], [[left, y], [right, y]], 0.45);
      hdLine(g, wood[4], [[left + 0.6, y + 0.45], [right - 0.6, y + 0.45]], 0.22);
      for (let knot = 0; knot < 2; knot++) {
        const x = between(random, left + 2, right - 3);
        hdPath(g, null, p => p.ellipse(x, y - 0.8, between(random, 0.45, 1), 0.15, 0, 0, Math.PI * 2), wood[2], 0.15);
      }
    }
    for (const x of [left + 0.35, right - 0.8]) {
      hdRound(g, wood[1], x, -wall, 1.1, wall - 1, 0.15);
      hdLine(g, wood[5], [[x + 0.3, -wall + 1], [x + 0.3, -2]], 0.25);
    }
    if (style.chimney) {
      const cx = side ? right - 10 : peak + Math.round(depth * 0.68);
      hdRound(g, hdGradient(g, cx, 0, cx + 4, 0, [palette.stone[2], palette.stone[1], palette.stone[0]]), cx, -wall - roof - rise - 6, 4, 11, 0.2);
      for (let y = -wall - roof - rise - 4; y < -wall - roof - rise + 3; y += 2) hdLine(g, palette.stone[0], [[cx, y], [cx + 4, y]], 0.25);
      hdRound(g, palette.stone[3], cx - 0.6, -wall - roof - rise - 7, 5.2, 1.6, 0.3);
      hdOval(g, palette.stone[0], cx + 2, -wall - roof - rise - 6.8, 1.7, 0.4);
    }
    const roofPoints = side
      ? [[left - 3, -wall + 0.5], [left + 2, -wall - roof], [right - 2, -wall - roof], [right + 3, -wall + 0.5]]
      : [[peak, -wall - roof - 0.5], [peak + depth, -wall - roof - rise - 0.5], [right + depth + 2.5, -wall - rise + 0.5], [right + 2.5, -wall + 0.5]];
    if (side || depth) {
      polygon(g, hdGradient(g, 0, -wall - roof - rise, 0, -wall + 1, [tile[3], tile[2], tile[0]]), roofPoints);
      g.save(); g.clip();
      for (let row = 0; row < roof + rise + 4; row += 2.2) {
        const y = -wall - roof - rise + row;
        hdLine(g, tile[1], [[left - 5, y], [right + depth + 4, y - (side ? 0 : rise * 0.3)]], 0.28);
        for (let x = left - 4 + (Math.floor(row / 2.2) % 2) * 1.8; x < right + depth + 3; x += 3.7) {
          hdPath(g, null, p => { p.moveTo(x, y); p.quadraticCurveTo(x + 0.5, y + 1, x + 0.2, y + 2.2); }, random() < 0.5 ? tile[1] : tile[3], 0.22);
        }
      }
      g.restore();
      hdLine(g, tile[3], side ? [[left + 2, -wall - roof], [right - 2, -wall - roof]] : [[peak, -wall - roof - 0.5], [peak + depth, -wall - roof - rise - 0.5]], 0.8);
    }
    if (!side) {
      // The front gable keeps the same geometry in both renderers.
      hdLine(g, wood[0], [[left - 2.5, -wall + 1], [peak, -wall - roof - 1], [right + 2.5, -wall + 1]], 1.8);
      hdLine(g, wood[5], [[left - 2.5, -wall], [peak, -wall - roof - 1], [right + 2.5, -wall]], 0.65);
      hdLine(g, wood[1], [[left, -wall + 0.8], [right, -wall + 0.8]], 1);
      hdLine(g, wood[3], [[peak, -wall - roof + 2], [peak, -wall + 1]], 0.65);
    } else hdLine(g, wood[0], [[left - 3, -wall + 0.6], [right + 3, -wall + 0.6]], 1.4);
    hdRound(g, wood[0], doorX - 0.7, -dh - 1, dw + 1.4, dh + 1, 0.8);
    hdRound(g, hdGradient(g, doorX, -dh, doorX + dw, 0, [wood[2], wood[1], wood[0]]), doorX, -dh, dw, dh, 0.5);
    hdRound(g, null, doorX + 0.7, -dh + 1, dw - 1.4, dh * 0.45 - 0.8, 0.2, wood[3], 0.25);
    hdRound(g, null, doorX + 0.7, -dh * 0.45, dw - 1.4, dh * 0.45 - 1, 0.2, wood[3], 0.25);
    hdOval(g, wood[5], doorX + dw - 0.9, -dh * 0.43, 0.26, 0.3);
    hdRound(g, palette.stone[2], doorX - 1.6, 0, dw + 3.2, 1.6, 0.3);
    hdLine(g, palette.stone[3], [[doorX - 1.4, 0.1], [doorX + dw + 1.4, 0.1]], 0.3);
    for (const window of houseWindows(house, d)) hdWindow(g, window, palette, house);
    if (style.porch && !side) {
      const start = doorX - 3;
      polygon(g, tile[1], [[start, -dh - 2], [start + 3, -dh - 5], [right, -dh - 5], [right + 1, -dh - 2]]);
      hdLine(g, tile[3], [[start, -dh - 2], [right + 1, -dh - 2]], 0.65);
      for (const px of [start + 0.5, right]) hdLine(g, wood[3], [[px, -dh - 2], [px, 1]], 0.85);
    }
    if (house.seed % 2 === 0 && palette.season !== 'winter') {
      // A terracotta pot by the door.
      hdPath(g, seasonTone('#b76e4b', palette.phase), p => { p.moveTo(doorX - 4, -2); p.lineTo(doorX - 1.7, -2); p.lineTo(doorX - 2, 0); p.lineTo(doorX - 3.7, 0); p.closePath(); });
      for (let i = 0; i < 3; i++) {
        hdLine(g, palette.leaf[2], [[doorX - 2.8, -2], [doorX - 4 + i, -4 - i % 2]], 0.3);
        hdOval(g, palette.flowers[i], doorX - 4 + i, -4 - i % 2, 0.5, 0.45);
      }
    }
    g.restore();
  }

  function drawSnowCoverHD(g, item, palette) {
    const snow = palette.snow;
    g.save();
    if (item.kind === 'house') {
      const {left, right, front, depth, wall, roof, peak, rise} = dimensions(item);
      g.translate(item.x, item.y); g.scale(item.face, 1);
      if (item.view === 'side') {
        polygon(g, hdGradient(g, 0, -wall - roof, 0, -wall, [snow[0], snow[1]]), [[left - 3, -wall], [left + 2, -wall - roof - 1], [right - 2, -wall - roof - 1], [right + 3, -wall]]);
        hdLine(g, snow[0], [[left - 2.5, -wall - 0.4], [right + 2.5, -wall - 0.4]], 1.8);
        hdLine(g, snow[0], [[left + 2, -wall - roof - 1], [right - 2, -wall - roof - 1]], 1.1);
      } else {
        if (depth) {
          polygon(g, hdGradient(g, 0, -wall - roof - rise, 0, -wall + 1, [snow[0], snow[1]]), [[peak, -wall - roof - 1], [peak + depth, -wall - roof - rise - 1], [right + depth + 3, -wall - rise], [right + 2.5, -wall + 0.7]]);
          hdLine(g, snow[0], [[right + 2.5, -wall], [right + depth + 2.5, -wall - rise]], 1.7);
          hdLine(g, snow[0], [[peak, -wall - roof - 1], [peak + depth, -wall - roof - rise - 1]], 1.4);
        }
        hdLine(g, snow[0], [[left - 2.7, -wall - 0.5], [peak, -wall - roof - 1], [right + 2.4, -wall - 0.1]], 1.65);
      }
      for (const window of houseWindows(item, dimensions(item))) hdRound(g, snow[0], window.x - 1.2, window.y + window.h + 0.6, window.w + 2.4, 0.9, 0.45);
      for (let i = 0; i < 4; i++) {
        const x = left + front * (0.15 + i * 0.22);
        const y = item.view === 'side' ? -wall + 0.5 : -wall - Math.max(0, roof * (1 - Math.abs((x - peak) / (front * 0.5))));
        hdPath(g, snow[1], p => { p.moveTo(x - 0.25, y); p.lineTo(x, y + 1.1 + i % 2); p.lineTo(x + 0.3, y); p.closePath(); });
      }
    } else if (item.kind === 'pine' || item.kind === 'festivalTree') {
      const h = item.height, half = item.width * 0.5, random = randomFrom(item.seed);
      const bend = integer(random, -Math.ceil(half * 0.25), Math.ceil(half * 0.25));
      const count = h > 44 ? 6 : h > 23 ? 5 : 4;
      for (let i = count - 1; i >= 0; i--) {
        const {x: cx, top, bottom: base, span} = pineTier(item, i, count, bend);
        hdPath(g, hdGradient(g, cx, top, cx, base, [snow[0], snow[1]]), p => {
          p.moveTo(cx, top + 0.2); p.quadraticCurveTo(cx + span * 0.08, top + h * 0.09, cx + span * 0.63, base - h * 0.055);
          p.quadraticCurveTo(cx + span * 0.48, base - h * 0.035, cx + span * 0.28, base - h * 0.07);
          p.quadraticCurveTo(cx + span * 0.15, base - h * 0.01, cx - span * 0.04, base - h * 0.07);
          p.quadraticCurveTo(cx - span * 0.2, base - h * 0.04, cx - span * 0.35, base - h * 0.07);
          p.quadraticCurveTo(cx - span * 0.5, base - h * 0.035, cx - span * 0.72, base - h * 0.055);
          p.quadraticCurveTo(cx - span * 0.15, top + h * 0.12, cx, top + 0.2); p.closePath();
        });
      }
    } else if (['rock', 'bush', 'stump'].includes(item.kind)) {
      hdOval(g, hdGradient(g, item.x, item.y - item.size, item.x, item.y, [snow[0], snow[1]]), item.x, item.y - item.size * 0.55, item.size * 0.57, Math.max(0.4, item.size * 0.18));
    }
    g.restore();
  }

  function drawTreeDecorationsHD(g, tree, palette) {
    g.save();
    // The wires follow each tier's own bent axis, just like the ornaments.
    for (let row = 0; row < 6; row++) {
      const bulbs = tree.lights.filter(bulb => bulb.row === row);
      if (bulbs.length < 2) continue;
      hdPath(g, null, p => hdSmooth(p, bulbs.map(b => [b.x + 0.3, b.y + 0.4])), seasonTone('#8a874c', palette.phase), 0.35);
    }
    for (const ornament of tree.ornaments) {
      const {x, y, color, size} = ornament;
      const c = seasonTone(festiveColors[color], palette.phase), r = size || 1.2;
      hdLine(g, seasonTone('#b7ad8c', palette.phase), [[x, y - r - 1], [x, y - r]], 0.2);
      hdOval(g, hdGradient(g, x - r, y - r, x + r, y + r, [seasonTone('#f5e7c8', palette.phase), c, seasonTone('#513d58', palette.phase)]), x, y, r * 0.88, r);
      hdOval(g, palette.snow[0], x - r * 0.3, y - r * 0.35, r * 0.18, r * 0.22);
      if (ornament.shape === 1) hdLine(g, palette.snow[0], [[x - r * 0.65, y], [x + r * 0.65, y]], 0.22);
    }
    for (const bulb of tree.lights) hdOval(g, seasonTone(festiveColors[bulb.color], palette.phase), bulb.x, bulb.y, 0.48, 0.6);
    drawTreeStar(g, tree, seasonTone('#f9cf77', palette.phase));
    g.restore();
  }

  function drawPropHD(g, item, palette, contact = true) {
    switch (item.kind) {
      case 'pine': case 'festivalTree': drawPineHD(g, item, palette, contact); break;
      case 'leaf': drawLeafTreeHD(g, item, palette, contact); break;
      case 'house': drawHouseHD(g, item, palette, contact); break;
      case 'rock': drawRockHD(g, item, palette); break;
      case 'fence': drawFenceHD(g, item, palette); break;
      default: drawUnderstoryHD(g, item, palette);
    }
    if (palette.season === 'winter') drawSnowCoverHD(g, item, palette);
    if (item.kind === 'festivalTree') drawTreeDecorationsHD(g, item, palette);
  }

  function generateCloudLayersHD(code, base) {
    const random = randomFrom(hash(code + '/hd-clouds'));
    return base.map((layer, type) => {
      if (!layer) return null;
      const surface = makeCanvas(CLOUD_TILE, SKY_HEIGHT), g = surface.getContext('2d');
      if (type >= 3) {
        g.filter = 'blur(' + renderScale * 0.9 + 'px)';
        for (const x of [-CLOUD_TILE, 0, CLOUD_TILE]) blit(g, layer.canvas, x, 0);
        g.filter = 'none';
      } else if (type === 1) {
        for (let i = 0; i < 11; i++) {
          const x = i * 71 + between(random, -30, 20), y = between(random, 12, 76), w = between(random, 44, 118);
          for (let strand = 0; strand < 9; strand++) {
            const sy = y + strand * 0.7, sx = x + strand * 2, length = w - strand * 3;
            const gradient = g.createLinearGradient(sx, sy, sx + length, sy);
            gradient.addColorStop(0, 'rgba(220,228,233,0)'); gradient.addColorStop(0.4, 'rgba(220,228,233,.58)'); gradient.addColorStop(1, 'rgba(238,240,242,0)');
            hdPath(g, null, p => { p.moveTo(sx, sy); p.bezierCurveTo(sx + length * 0.3, sy - 2, sx + length * 0.7, sy - 11, sx + length, sy - 9 + strand * 0.3); }, gradient, 0.4 + strand * 0.05);
          }
        }
      } else {
        for (let i = 0; i < 9; i++) {
          const x = i * 87 + between(random, -25, 25), y = between(random, 35, 110), w = between(random, 35, 85), h = between(random, 9, 24);
          for (const shift of [-CLOUD_TILE, 0, CLOUD_TILE]) {
            hdOval(g, hdGradient(g, 0, y - h, 0, y + h * 0.4, ['#e6eaeb', '#9da9b4']), x + shift, y, w * 0.6, h * 0.4);
            for (let j = 0; j < 7; j++) {
              const px = x + (j / 6 - 0.5) * w + shift, py = y - Math.sin(j / 6 * Math.PI) * h * 0.58;
              const rx = w * between(random, 0.13, 0.22), ry = h * between(random, 0.35, 0.7);
              const gradient = g.createRadialGradient(px - rx * 0.3, py - ry * 0.5, 0, px, py, Math.max(rx, ry));
              gradient.addColorStop(0, '#f6f5ed'); gradient.addColorStop(0.65, '#d9dfe0'); gradient.addColorStop(1, '#a1adb8');
              hdOval(g, gradient, px, py, rx, ry);
            }
            hdOval(g, hdGradient(g, 0, y, 0, y + h * 0.4, ['#c2cbd0', '#a3b0bb']), x + shift, y + h * 0.15, w * 0.53, h * 0.28);
          }
        }
      }
      const sample = makeCanvas(CLOUD_TILE, SKY_HEIGHT, 1), sg = sample.getContext('2d');
      sg.drawImage(surface, 0, 0, CLOUD_TILE, SKY_HEIGHT);
      const data = sg.getImageData(0, 0, CLOUD_TILE, SKY_HEIGHT).data;
      const opacity = new Uint8Array(CLOUD_TILE * SKY_HEIGHT);
      for (let i = 0; i < opacity.length; i++) opacity[i] = data[i * 4 + 3];
      releaseSurface(sample);
      return {canvas: surface, opacity, speed: layer.speed};
    });
  }

  function drawSkyHD(world, light, motion, weather, clouds, sun, moon) {
    const a = seasonalColors[light.from], b = seasonalColors[light.to];
    const sky = a.sky.map((c, i) => blendRgb(blendRgb(rgb(c), rgb(b.sky[i]), light.blend), [75, 93, 115], clouds.coverage * (0.12 + i * 0.095)));
    const gradient = ctx.createLinearGradient(0, 0, 0, 154);
    [0, 0.42, 0.73, 1].forEach((t, i) => gradient.addColorStop(t, cssColor(sky[i])));
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (moon.darkness > 0) {
      for (const star of world.atmosphere.stars) {
        const shimmer = 0.74 + Math.sin(motion * 1.2 + star.flicker) * 0.26;
        ctx.globalAlpha = moon.darkness * mix(0.13, 0.75, star.tone) * shimmer;
        hdOval(ctx, star.tone > 0.72 ? '#f8e8bb' : '#c4d6ed', star.x, star.y, mix(0.14, 0.38, star.tone), mix(0.14, 0.38, star.tone));
        if (star.tone > 0.96) {
          ctx.globalAlpha *= 0.4;
          hdPath(ctx, null, p => { p.moveTo(star.x - 1.1, star.y); p.lineTo(star.x + 1.1, star.y); p.moveTo(star.x, star.y - 1.1); p.lineTo(star.x, star.y + 1.1); }, '#e5dfd4', 0.18);
        }
      }
    }
    ctx.globalAlpha = 1;
    if (sun.active) {
      const {x, y, color, elevation} = sun, low = 1 - smooth((elevation - 0.15) / 0.68);
      const rim = ctx.createLinearGradient(0, 0, 0, SKY_HEIGHT);
      rim.addColorStop(0.18, translucent(color, 0));
      rim.addColorStop(0.7, translucent(blendRgb(color, [241, 123, 153], 0.4), low * sun.glow * 0.25));
      rim.addColorStop(1, translucent(blendRgb(color, [255, 170, 104], 0.28), low * sun.glow * 0.65));
      ctx.fillStyle = rim; ctx.fillRect(0, 0, W, SKY_HEIGHT);
      const halo = ctx.createRadialGradient(x, y, 3, x, y, mix(57, 144, low));
      halo.addColorStop(0, translucent(blendRgb(color, [255, 239, 222], 0.4), sun.glow * 0.6));
      halo.addColorStop(0.3, translucent(color, sun.glow * 0.25)); halo.addColorStop(1, translucent(color, 0));
      ctx.fillStyle = halo; ctx.fillRect(0, 0, W, SKY_HEIGHT);
      const disk = g => hdGradient(g, x, y - 9, x, y + 9, ['#fffae5', cssColor(blendRgb(color, [255, 250, 227], elevation * 0.65))]);
      ctx.globalAlpha = 1 - weather.fog * 0.48;
      hdOval(ctx, disk(ctx), x, y, 8.7, 8.7);
      ctx.globalAlpha = 1;
    }
    if (moon.brightness > 0) {
      const {x, y} = moon;
      const halo = ctx.createRadialGradient(x, y, 3, x, y, 42);
      halo.addColorStop(0, translucent([164, 191, 244], moon.brightness * 0.25));
      halo.addColorStop(0.36, translucent([141, 172, 230], moon.brightness * 0.12)); halo.addColorStop(1, 'rgba(121,151,217,0)');
      ctx.fillStyle = halo; ctx.fillRect(0, 0, W, SKY_HEIGHT);
      ctx.globalAlpha = moon.brightness;
      hdPath(ctx, hdGradient(ctx, x - 4, y - 6, x + 3, y + 6, ['#f5f0d7', '#becad0']), p => {
        p.moveTo(x + 2, y - 5.6); p.bezierCurveTo(x - 7, y - 8, x - 10, y + 5, x - 1, y + 6);
        p.quadraticCurveTo(x + 3, y + 7, x + 5, y + 3); p.bezierCurveTo(x - 1, y + 5, x - 5, y - 3, x + 2, y - 5.6); p.closePath();
      });
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    drawClouds(clouds, sun, moon.darkness, weather.rain);
  }

  function drawSnowfallHD(world, motion, intensity, darkness) {
    const wind = Math.sin(motion * 0.16) * 13 + Math.sin(motion * 0.057) * 9;
    ctx.save();
    for (const [i, flake] of world.seasonEffects.snow.entries()) {
      if (i / world.seasonEffects.snow.length > intensity) continue;
      const x = wrap(flake.x + motion * flake.drift + Math.sin(motion * 0.8 + flake.phase) * (5 + flake.size * 12) + wind * Math.sin(motion * 0.24 + flake.phase), W + 48) - 24;
      const y = wrap(flake.y + motion * flake.speed + Math.sin(motion * 1.3 + flake.phase) * 4, H + 24) - 12;
      ctx.globalAlpha = mix(0.3, 0.87, flake.size) * (1 - darkness * 0.28);
      const size = mix(0.15, 0.72, flake.size);
      if (flake.size > 0.88) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(motion * 0.6 + flake.phase);
        for (let arm = 0; arm < 3; arm++) {
          const a = arm / 3 * Math.PI;
          hdLine(ctx, '#edf3f6', [[Math.cos(a) * size, Math.sin(a) * size], [-Math.cos(a) * size, -Math.sin(a) * size]], 0.18);
        }
        ctx.restore();
      } else hdOval(ctx, flake.size > 0.6 ? '#edf3f6' : '#bcd0e2', x, y, size, size * 0.85);
    }
    ctx.restore();
  }

  function drawRainHD(world, motion, intensity) {
    ctx.save();
    for (const drop of world.atmosphere.drops) {
      const travel = motion * drop.speed, x = wrap(drop.x - travel * 0.36, W + 80) - 35, y = wrap(drop.y + travel, H + 50) - 22;
      const gradient = ctx.createLinearGradient(x, y, x - drop.length * 0.36, y + drop.length);
      gradient.addColorStop(0, 'rgba(203,222,231,0)'); gradient.addColorStop(1, 'rgba(203,222,231,.8)');
      ctx.globalAlpha = intensity * mix(0.17, 0.5, drop.tone);
      hdLine(ctx, gradient, [[x, y], [x - drop.length * 0.36, y + drop.length]], 0.25 + drop.tone * 0.15);
      if (y > 182 && drop.tone > 0.82 && wrap(travel + drop.y, 67) < 7) {
        hdPath(ctx, null, p => p.ellipse(x, y + 2, 1.8, 0.6, 0, 0, Math.PI * 2), '#cbd8cf', 0.2);
      }
    }
    ctx.restore();
  }

  function drawFootprintsHD(g, world, motion) {
    const lifetime = 115 / (1 + weather.rain * 2.2);
    g.save();
    for (const mark of world.seasonEffects.footprints) {
      g.globalAlpha = clamp(1 - (motion - mark.born) / lifetime) * 0.4;
      const side = mark.step ? 1 : -1;
      if (mark.person) {
        g.save(); g.translate(mark.x, mark.y + side * 0.6); g.rotate(mark.direction * -0.35);
        hdOval(g, '#617f9a', 0, 0, 0.42, 0.8); hdOval(g, '#d9e4eb', 0.1, 0.2, 0.22, 0.45); g.restore();
      } else {
        hdOval(g, '#617f9a', mark.x, mark.y + side * 0.5, 0.47, 0.33);
        for (let i = 0; i < 3; i++) hdOval(g, '#617f9a', mark.x + mark.direction * 0.5, mark.y + side * 0.5 - 0.3 + i * 0.3, 0.13, 0.13);
      }

  function desiredRenderScale() {

  function configureRenderer() {

  function releaseTerrainArtwork() {

      for (const mask of world.moonMasks) releaseSurface(mask);

    if (world.foregroundMasks) {

  function releaseCloudArtwork(cloudLayers) {

  }

  function releaseModeArtwork() {

  function buildCloudArtwork() {

  }

  function landArtwork(world, phase) {

  // Smooth illustrated inhabitants. All coordinates remain in the 480 × 270 world.
  function characterShape(g, color, draw, stroke, width = 0.5) {
    g.beginPath();

  function characterOval(g, color, x, y, rx, ry, angle = 0) {

  function drawGroundActorHD(g, actor, motion) {

  }

    characterOval(g, actor.skin, 2.35, -10.75, 0.55, 0.48);

      characterStroke(g, '#e8d9b2', 0.65, p => { p.moveTo(-1.5, -12); p.quadraticCurveTo(0.5, -12.8, 2.8, -12.3); });

      characterStroke(g, '#867452', 0.35, p => { p.moveTo(-0.8, -13.4); p.lineTo(1.9, -13.4); });

  function characterSleepingDog(g, actor, motion) {

    characterOval(g, characterTone(actor.coat, '#443e37', 0.3), 1.9, -2.7, 0.8, 1.5, -0.3);

  function characterAnimal(g, actor, motion, stride, hop) {
    const kind = actor.kind;
    const bear = kind === 'bear', deer = kind === 'deer', hare = kind === 'hare', cat = kind === 'cat', fox = kind === 'fox';
    const body = bear ? 10 : deer ? 9 : hare ? 5 : 7;

    const base = -legs - hop;

    const dark = characterTone(actor.coat, '#23343c', 0.32);

  const musicButton = byId('music-toggle');

  function musicDegree(score, degree) {
    return score.root + score.scale[wrap(degree, 7)] + Math.floor(degree / 7) * 12;
  }

  function initAudio() {
    const AudioEngine = window.AudioContext || window.webkitAudioContext;
    if (!AudioEngine) throw new Error('unsupported');
    const context = new AudioEngine();
    music.context = context;
    const random = randomFrom(64064);
    music.noise = context.createBuffer(1, context.sampleRate * 0.5, context.sampleRate);
    const noise = music.noise.getChannelData(0);
    for (let i = 0; i < noise.length; i++) noise[i] = random() * 2 - 1;
    music.impulse = context.createBuffer(2, Math.floor(context.sampleRate * 1.65), context.sampleRate);
    for (let channel = 0; channel < 2; channel++) {
      const data = music.impulse.getChannelData(channel);
      for (let i = 0; i < data.length; i++) {
        data[i] = (random() * 2 - 1) * (1 - i / data.length) ** 3 * 0.48;
      }
    }
    const compressor = context.createDynamicsCompressor();
    compressor.threshold.value = -21;
    compressor.knee.value = 18;
    compressor.ratio.value = 3;
    compressor.attack.value = 0.012;
    compressor.release.value = 0.24;
    music.master = context.createGain();
    music.master.gain.value = 0;
    music.master.connect(compressor);
    compressor.connect(context.destination);
  }

  function createMusicBus(name) {
    const c = music.context;
    const score = musicScores[name];
    const input = c.createGain();
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 7200;
    const output = c.createGain();
    const convolver = c.createConvolver();
    convolver.buffer = music.impulse;
    const reverb = c.createGain();
    reverb.gain.value = name === 'winter' ? 0.29 : 0.17;
    const delay = c.createDelay(2);
    delay.delayTime.value = 60 / score.bpm * 0.75;
    const feedback = c.createGain();
    feedback.gain.value = name === 'winter' ? 0.33 : 0.22;
    const echo = c.createGain();
    echo.gain.value = name === 'winter' ? 0.22 : 0.12;
    input.connect(filter);
    filter.connect(output);
    input.connect(convolver);
    convolver.connect(reverb);
    reverb.connect(output);
    input.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(echo);
    echo.connect(output);
    output.connect(music.master);
    output.gain.setValueAtTime(0, c.currentTime);
    output.gain.linearRampToValueAtTime(0.84, c.currentTime + 1.5);
    return { name, input, output, score, voices: new Set(), row: 0, nextTime: c.currentTime + 0.04,
      nodes: [input, filter, output, convolver, reverb, delay, feedback, echo] };
  }

  function holdMusicGain(parameter, time) {
    if (typeof parameter.cancelAndHoldAtTime === 'function') {
      parameter.cancelAndHoldAtTime(time);
      return;
    }
    const value = parameter.value;
    parameter.cancelScheduledValues(time);
    parameter.setValueAtTime(value, time);
  }

  function retireMusicBus(bus) {
    const now = music.context.currentTime;
    holdMusicGain(bus.output.gain, now);
    bus.output.gain.linearRampToValueAtTime(0, now + 1.65);
    bus.stopAt = now + 1.8;
    music.retiring.push(bus);
  }

  function changeMusicSeason() {
    if (!music.context || !music.enabled || music.context.state !== 'running') return;
    if (music.bus?.name === season) return;
    if (music.bus) retireMusicBus(music.bus);
    music.bus = createMusicBus(season);
  }

  function connectVoice(bus, sources, nodes, output, pan, start, end) {
    const panner = music.context.createStereoPanner();
    panner.pan.value = pan;
    output.connect(panner);
    panner.connect(bus.input);
    const voice = { sources, nodes: [...sources, ...nodes, panner] };
    bus.voices.add(voice);
    sources[0].onended = () => {
      for (const node of voice.nodes) node.disconnect();
      bus.voices.delete(voice);
    };
    for (const source of sources) {
      source.start(start);
      source.stop(end);
    }
  }

  function musicNote(bus, midi, time, duration, instrument, level, pan = 0) {
    const c = music.context;
    const frequency = 440 * 2 ** ((midi - 69) / 12);
    const oscillator = c.createOscillator();
    const envelope = c.createGain();
    const filter = c.createBiquadFilter();
    const sources = [oscillator];
    const nodes = [envelope, filter];
    const pad = instrument === 'pad';
    const bell = instrument === 'bell';
    const attack = pad ? 0.28 : instrument === 'reed' ? 0.055 : 0.009;
    const release = pad ? 0.85 : bell ? 1.45 : instrument === 'flute' ? 0.23 : 0.12;
    const end = time + duration + release;
    oscillator.type = instrument === 'pluck' || instrument === 'reed' ? 'square' : 'triangle';
    if (bell || instrument === 'flute') oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(frequency, time);
    filter.type = 'lowpass';
    filter.Q.value = 0.5;
    filter.frequency.setValueAtTime(pad ? 950 : instrument === 'bass' ? 700 : bus.score.brightness, time);
    if (instrument === 'pluck') {
      filter.frequency.exponentialRampToValueAtTime(700, time + duration + 0.08);
    }
    envelope.gain.setValueAtTime(0, time);
    envelope.gain.linearRampToValueAtTime(level, time + Math.min(attack, duration * 0.45));
    envelope.gain.exponentialRampToValueAtTime(Math.max(0.0001, level * (bell ? 0.12 : pad ? 0.76 : 0.44)), time + duration);
    envelope.gain.exponentialRampToValueAtTime(0.0001, end - 0.015);
    envelope.gain.linearRampToValueAtTime(0, end);
    oscillator.connect(filter);
    if (pad) {
      const second = c.createOscillator();
      second.type = 'triangle';
      second.frequency.setValueAtTime(frequency, time);
      second.detune.value = 7;
      oscillator.detune.value = -6;
      second.connect(filter);
      sources.push(second);
    }
    if (bell || instrument === 'flute' || instrument === 'reed') {
      const modulation = c.createOscillator();
      const amount = c.createGain();
      modulation.frequency.value = bell ? frequency * 1.414 : 4.6;
      amount.gain.setValueAtTime(bell ? frequency * 1.7 : frequency * 0.004, time);
      if (bell) amount.gain.exponentialRampToValueAtTime(frequency * 0.025, time + duration + 1);
      modulation.connect(amount);
      amount.connect(oscillator.frequency);
      sources.push(modulation);
      nodes.push(amount);
    }
    filter.connect(envelope);
    connectVoice(bus, sources, nodes, envelope, pan, time, end);
  }

  function musicDrum(bus, kind, time, level) {
    const c = music.context;
    const gain = c.createGain();
    if (kind === 'kick') {
      const oscillator = c.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(112, time);
      oscillator.frequency.exponentialRampToValueAtTime(43, time + 0.13);
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(level, time + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.28);
      oscillator.connect(gain);
      connectVoice(bus, [oscillator], [gain], gain, 0, time, time + 0.3);
      return;
    }
    const source = c.createBufferSource();
    source.buffer = music.noise;
    const filter = c.createBiquadFilter();
    filter.type = kind === 'hat' ? 'highpass' : 'bandpass';
    filter.frequency.value = kind === 'hat' ? 6500 : 1800;
    filter.Q.value = kind === 'hat' ? 0.5 : 0.7;
    const duration = kind === 'hat' ? 0.065 : 0.17;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(level, time + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
    source.connect(filter);
    filter.connect(gain);
    connectVoice(bus, [source], [gain, filter], gain, kind === 'hat' ? 0.28 : -0.12, time, time + duration + 0.01);
  }

  function scheduleMusicRow(bus) {
    const { row, nextTime: time, score } = bus;
    const step = 60 / score.bpm / 4;
    const bar = Math.floor(row / 16);
    const beat = row % 16;
    const chord = score.chords[bar % 8];
    const bright = bus.name === 'spring';
    if (beat === 0) {
      for (const [i, interval] of [0, 2, 4, 6].entries()) {
        musicNote(bus, musicDegree(score, chord + interval), time + i * 0.013,
          step * 14.7, 'pad', score.padLevel, (i - 1.5) * 0.28);
      }
    }
    if (beat === 0 || beat === 8) {
      musicNote(bus, musicDegree(score, chord + (beat === 8 ? 4 : 0)) - 12,
        time, step * (bright ? 3 : 6), 'bass', score.bassLevel);
    }
    const arpSpacing = bright ? 1 : 2;
    if (beat % arpSpacing === 0) {
      const order = bus.name === 'winter' ? [0, 4, 2, 6, 4, 2, 6, 2] : [0, 2, 4, 6, 4, 2, 6, 4];
      const degree = chord + 7 + order[(beat / arpSpacing) % 8];
      musicNote(bus, musicDegree(score, degree), time, step * 0.73,
        bus.name === 'winter' ? 'bell' : 'pluck', score.arpLevel, beat % 4 ? 0.42 : -0.42);
    }
    let degree = score.melody[bar % 8][beat];
    if (degree >= 0) {
      if (bar >= 8 && bar < 12 && beat < 8) degree += bright ? 2 : 1;
      const duration = step * (bright ? 0.95 : bus.name === 'winter' ? 3.4 : 2.65);
      musicNote(bus, musicDegree(score, degree), time, duration, score.lead, score.leadLevel, -0.08);
    }
    if (bright) {
      if (beat === 0 || beat === 8 || (bar % 4 === 3 && beat === 14)) musicDrum(bus, 'kick', time, 0.16);
      if (beat === 4 || beat === 12) musicDrum(bus, 'snare', time, 0.055);
      if (beat % 2 === 0) musicDrum(bus, 'hat', time, beat % 4 ? 0.025 : 0.018);
    } else if (bus.name === 'summer') {
      if (beat === 0) musicDrum(bus, 'kick', time, 0.095);
      if (beat === 12) musicDrum(bus, 'snare', time, 0.022);
      if (beat === 4 || beat === 10) musicDrum(bus, 'hat', time, 0.013);
    } else if (bus.name === 'autumn') {
      if (beat === 0 && bar % 2 === 0) musicDrum(bus, 'kick', time, 0.075);
      if (beat === 12) musicDrum(bus, 'snare', time, 0.018);
    } else if (beat === 0 && bar % 4 === 0) {
      musicDrum(bus, 'kick', time, 0.055);
    }
    bus.row = (row + 1) % 256;
    bus.nextTime += step;
  }

  function scheduleMusic() {
    const c = music.context;
    if (!c || c.state !== 'running' || !music.enabled || paused || document.hidden) return;
    const bus = music.bus;
    if (bus.nextTime < c.currentTime - 0.1) bus.nextTime = c.currentTime + 0.025;
    while (bus.nextTime < c.currentTime + 0.3) scheduleMusicRow(bus);
    music.retiring = music.retiring.filter(old => {
      if (old.stopAt > c.currentTime) return true;
      for (const voice of old.voices) {
        for (const source of voice.sources) source.stop();
        for (const node of voice.nodes) node.disconnect();
      }
      for (const node of old.nodes) node.disconnect();
      return false;
    });
  }

  function updateMusicButton() {
    musicButton.setAttribute('aria-pressed', music.enabled);
    const label = music.enabled ? 'Выключить музыку' : 'Включить музыку';
    musicButton.setAttribute('aria-label', label);
    musicButton.title = label;
  }

  function syncMusicPlayback() {
    music.operation = music.operation.then(async () => {
      if (!music.context) return;
      if (music.enabled && !paused && !document.hidden) {
        await music.context.resume();
        changeMusicSeason();
        const now = music.context.currentTime;
        holdMusicGain(music.master.gain, now);
        music.master.gain.linearRampToValueAtTime(music.volume, now + 0.12);
        if (!music.timer) music.timer = setInterval(scheduleMusic, 25);
        scheduleMusic();
      } else {
        clearInterval(music.timer);
        music.timer = null;
        const now = music.context.currentTime;
        holdMusicGain(music.master.gain, now);
        music.master.gain.linearRampToValueAtTime(0, now + 0.06);
        await new Promise(resolve => setTimeout(resolve, 75));
        await music.context.suspend();
      }
    }).catch(error => {
      console.error('Не удалось включить музыку', error);
      music.enabled = false;
      clearInterval(music.timer);
      music.timer = null;
      if (music.context) music.context.suspend().catch(() => {});
      updateMusicButton();
      byId('music-status').hidden = false;
      byId('music-status').textContent = 'Не удалось включить звук. Нажмите «Музыка» ещё раз.';
    });
    return music.operation;
  }

  musicButton.addEventListener('click', () => {
    byId('music-status').hidden = true;
    try {
      if (!music.context) initAudio();
      music.enabled = !music.enabled;
      updateMusicButton();
      syncMusicPlayback();
    } catch {
      byId('music-status').hidden = false;
      byId('music-status').textContent = 'Этот браузер не поддерживает синтез музыки.';
      musicButton.disabled = true;
    }
  });
  musicVolume.addEventListener('input', () => {
    music.volume = musicVolume.valueAsNumber / 100 * 0.65;
    if (music.context?.state !== 'running' || !music.enabled || paused || document.hidden) return;
    music.master.gain.setTargetAtTime(music.volume, music.context.currentTime, 0.04);
  });

  let world;
  let layers = {};
  let simulatedMinutes = START_HOUR * 60;
  let motion = 0;
  let paused = false;
  let weather;
  let frame = 0;
  let lastRender = 0;

  const currentWeather = () => weatherAt(world, simulatedMinutes / 60, weatherPicker.value, coverPicker.value);

  function showWeatherNow() {
    weather = currentWeather();
    render();
  }

  function render() {
    if (!world) return;
    const hour = simulatedMinutes / 60;
    const light = lightingAt(hour);
    const clouds = cloudState(world, motion, weather.level);
    const sun = sunlightAt(world, hour, weather, clouds);
    const moon = moonlightAt(world, hour, weather, clouds);
    drawSky(world, light, motion, weather, clouds, sun, moon);
    drawLand(world, light, hour, motion, weather, clouds, sun, moon);
    const minutes = Math.floor(simulatedMinutes);
    if (clock.valueAsNumber !== minutes) clock.value = minutes;
    const display = [Math.floor(minutes / 60), minutes % 60].map(value => String(value).padStart(2, '0')).join(':');
    if (byId('time-label').textContent !== display) byId('time-label').textContent = display;
    clock.setAttribute('aria-valuetext', display);
  }

  function tick(now) {
    frame = 0;
    const elapsed = now - lastRender;
    if (elapsed >= 40) {
      const dt = Math.min(elapsed / 1000, 0.15);
      lastRender = now;
      simulatedMinutes = wrap(simulatedMinutes + dt * DAY_MINUTES / DAY_SECONDS, DAY_MINUTES);
      motion += dt;
      const target = currentWeather();
      for (const key of Object.keys(weather)) weather[key] = mix(weather[key], target[key], 1 - Math.exp(-dt * 0.83));
      render();
    }
    startClock();
  }

  function startClock() {
    if (!frame && !paused && !document.hidden) frame = requestAnimationFrame(tick);
  }

  function resetClock() {
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
    lastRender = performance.now();
    startClock();
  }

  function freshCode() {
    return Array.from(crypto.getRandomValues(new Uint32Array(2)),
      value => value.toString(36).padStart(7, '0')).join('-');
  }

  const normalizeCode = value => Array.from(value.trim()).slice(0, 48).join('');

  function codeFromUrl() {
    try {
      return normalizeCode(decodeURIComponent(location.hash.slice(1)));
    } catch {
      return '';
    }
  }

  function selectVillage(code) {
    if (world) {
      releaseModeArtwork();
      releaseCloudArtwork(world.pixelCloudLayers);
    }
    world = generateWorld(code);
    world.population = createGroundPopulation(world);
    world.flocks = createFlocks(code);
    world.pixelCloudLayers = generateCloudLayersPixel(code);
    buildCloudArtwork();
    world.festivalTree = createFestivalTree(world);
    const fragment = '#' + encodeURIComponent(code);
    if (location.hash !== fragment) {
      try { history.replaceState(null, '', fragment); }
      catch { location.hash = fragment; }
    }
    seedField.value = code;
    motion = 0;
    rebuildSeason();
    showWeatherNow();
    resetClock();
  }

  function rebuildSeason() {
    releaseTerrainArtwork();
    world.sceneItems = season === 'winter' ? [...world.items, world.festivalTree].sort((a, b) => a.y - b.y) : world.items;
    seasonalColors = Object.fromEntries(Object.entries(colors).map(([phase, base]) =>
      [phase, seasonalPalette(base, phase)]));
    world.seasonEffects = createSeasonEffects(world);
    weatherPicker.querySelector('option[value="rain"]').textContent = season === 'winter' ? 'Снег' : 'Дождь';
  }

  for (const button of document.querySelectorAll('[data-season]')) {
    button.addEventListener('click', () => {
      if (season === button.dataset.season) return;
      season = button.dataset.season;
      for (const option of document.querySelectorAll('[data-season]')) {
        option.setAttribute('aria-pressed', option === button);
      }
      rebuildSeason();
      changeMusicSeason();
      showWeatherNow();
      resetClock();
    });
  }

  function togglePause() {
    paused = !paused;
    const label = paused ? 'Продолжить' : 'Пауза';
    pauseButton.setAttribute('aria-pressed', paused);
    pauseButton.setAttribute('aria-label', label);
    pauseButton.title = label + ' (пробел)';
    pauseButton.querySelector('.action-label').textContent = label;
    pauseButton.querySelector('.compact-icon').textContent = paused ? '▶' : 'Ⅱ';
    resetClock();
    syncMusicPlayback();
  }

  function openSettings(open) {
    settings.hidden = !open;
    settingsToggle.setAttribute('aria-expanded', open);
  }

  function toggleInterface(event) {
    const cornerButton = event?.currentTarget === interfaceToggle;
    ui.hidden = !ui.hidden;
    const label = ui.hidden ? 'Показать интерфейс' : 'Скрыть интерфейс';
    interfaceToggle.setAttribute('aria-label', label);
    interfaceToggle.setAttribute('aria-pressed', ui.hidden);
    interfaceToggle.title = label + ' (H)';
    if (ui.hidden) {
      openSettings(false);
      if (!cornerButton) canvas.focus({ preventScroll: true });
    } else if (!cornerButton) {
      settingsToggle.focus({ preventScroll: true });
    }
  }

  byId('regenerate').addEventListener('click', () => selectVillage(freshCode()));
  byId('seed-form').addEventListener('submit', event => {
    event.preventDefault();
    const code = normalizeCode(seedField.value);
    if (code) selectVillage(code);
  });
  window.addEventListener('hashchange', () => {
    const code = codeFromUrl();
    if (code !== world.code) selectVillage(code || freshCode());
  });

  clock.addEventListener('input', () => {
    simulatedMinutes = clock.valueAsNumber;
    world.seasonEffects.previous.clear();
    showWeatherNow();
  });
  for (const control of [weatherPicker, coverPicker]) {
    control.addEventListener('change', () => {
      if (paused) showWeatherNow();
    });
  }

  settingsToggle.addEventListener('click', () => openSettings(settings.hidden));
  byId('hide-ui').addEventListener('click', toggleInterface);
  interfaceToggle.addEventListener('click', toggleInterface);
  canvas.addEventListener('click', event => {
    const bounds = canvas.getBoundingClientRect();
    const x = (event.clientX - bounds.left) / bounds.width;
    const y = (event.clientY - bounds.top) / bounds.height;
    const centralTap = x >= 0.18 && x <= 0.82 && y >= 0.18 && y <= 0.82;
    if ((touchInterface.matches && centralTap) || (!touchInterface.matches && ui.hidden)) {
      toggleInterface();
    } else if (!ui.hidden) {
      openSettings(false);
    }
  });
  pauseButton.addEventListener('click', togglePause);

  if (!document.fullscreenEnabled) fullscreenButton.hidden = true;
  fullscreenButton.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await byId('village').requestFullscreen();
    } catch {
      fullscreenButton.hidden = true;
    }
  });
  document.addEventListener('fullscreenchange', () => {
    const label = document.fullscreenElement ? 'Выйти из полного экрана' : 'На весь экран';
    fullscreenButton.setAttribute('aria-label', label);
    fullscreenButton.querySelector('.action-label').textContent = label;
  });
  document.addEventListener('visibilitychange', () => {
    resetClock();
    syncMusicPlayback();
  });
  document.addEventListener('keydown', event => {
    if (event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.key === 'Escape') {
      if (ui.hidden) toggleInterface();
      else if (!settings.hidden) {
        openSettings(false);
        settingsToggle.focus();
      }
      return;
    }
    if (event.target.closest('input, select')) return;
    if (event.code === 'Space' && !event.target.closest('button')) {
      event.preventDefault();
      togglePause();
    }
    if (event.code === 'KeyH') toggleInterface();
  });

  function refreshRenderer() {
    releaseModeArtwork();
    configureRenderer();
    buildCloudArtwork();
    render();
    resetClock();
  }

  for (const button of document.querySelectorAll('[data-render]')) {
    button.addEventListener('click', () => {
      if (renderMode === button.dataset.render) return;
      renderMode = button.dataset.render;
      try { localStorage.setItem('village-render', renderMode); } catch {}
      refreshRenderer();
    });
  }
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (desiredRenderScale() === renderScale) return;
      refreshRenderer();
    }, 180);
  });

  configureRenderer();
  selectVillage(codeFromUrl() || freshCode());
})();
</script>
</body>
</html>
