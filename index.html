    let nearest = 1;
    for (const bird of world.visibleBirds) {
      const width = bird.species === 'stork' ? 10 : bird.species === 'sparrow' || bird.species === 'tit' ? 5 : 7;
      const distance = ((point.x - bird.x) / (width * bird.scale + 2)) ** 2 +
        ((point.y - bird.y) / (5 * bird.scale + 2)) ** 2;
      if (distance >= nearest) continue;
      nearest = distance;
      hit = bird;
    }
    const shot = { ...point, started: motion };
    world.shots.push(shot);
    if (!hit) return;

    const random = randomFrom(hash(world.code + '/падение/' + world.fallenBirds.length));
    dropBird(world, hit, motion, random);
    shot.impact = hit;
    shot.droplets = makeBloodDroplets(random, hit.direction, 13);
  }

  function dropBird(world, bird, motion, random) {
    world.birdHits.set(bird.member, bird.cycle);
    const falling = { ...bird, started: motion, landing: birdLanding(world, bird, random),
      duration: between(random, 1.05, 1.5), turns: between(random, 3.2, 4.3), landed: false };
    world.fallenBirds.push(falling);
    return falling;
  }

  function makeBloodDroplets(random, direction, count, force = 1) {
    return Array.from({ length: count }, (_, i) => {
      const angle = between(random, 0, Math.PI * 2);
      const speed = between(random, 14, 57);
      return { vx: (Math.cos(angle) * speed + direction * 11) * force, vy: (Math.sin(angle) * speed - 10) * force,
        life: between(random, 0.27, 0.64), size: i < Math.floor(count / 3) ? 2 : 1,
        color: pick(random, ['#671b26', '#a72e3a', '#d6514e']) };
    });
  }

  function drawBloodBurst(g, droplets, x, y, age) {
    for (const drop of droplets) {
      if (age >= drop.life) continue;
      g.globalAlpha = 1 - smooth((age / drop.life - 0.57) / 0.43);
      pixels(g, drop.color, x + drop.vx * age, y + drop.vy * age + 60 * age * age, drop.size, 1);
    }
    g.globalAlpha = 1;
  }

  function drawShots(g, world, motion) {
    world.shots = world.shots.filter(shot => motion - shot.started < 0.65);
    for (const shot of world.shots) {
      const age = motion - shot.started;
      if (age < 0.18) {
        const spread = 2 + age * 24;
        g.globalAlpha = 1 - age / 0.18;
        pixels(g, '#f9deaf', shot.x - spread - 1, shot.y, 2);
        pixels(g, '#f9deaf', shot.x + spread, shot.y, 2);
        pixels(g, '#f9deaf', shot.x, shot.y - spread - 1, 1, 2);
        pixels(g, '#f9deaf', shot.x, shot.y + spread, 1, 2);
      }
      if (shot.droplets) drawBloodBurst(g, shot.droplets, shot.impact.x, shot.impact.y, age);
    }
    g.globalAlpha = 1;
  }

  function drawFallenBird(g, bird, colors, motion) {
    const age = motion - bird.started;
    const { landing, species, scale } = bird;
    if (!bird.landed) {
      const t = clamp(age / bird.duration);
      const phase = t * bird.turns * Math.PI * 2;
      const envelope = Math.sin(Math.PI * t);
      const { x, y } = fallingBirdPosition(bird, motion);
      const dx = landing.x - bird.x;
      const direction = Math.sign(dx) || bird.direction;
      const angle = Math.atan2(landing.y - bird.y, Math.abs(dx)) * direction;
      g.save();
      g.translate(Math.round(x), Math.round(y));
      g.rotate(angle * smooth(t * 8) + Math.sin(phase) * envelope * 0.71);
      g.scale(direction * scale, scale * (0.17 + 0.83 * Math.cos(phase)));
      if (species === 'bat') drawBat(g, colors, -0.53 + Math.sin(phase) * 0.32, Math.sin(phase));
      else drawFlyingBird(g, species, colors, -0.53 + Math.sin(phase) * 0.32, Math.sin(phase));
      pixels(g, '#87232d', 0, 1, 2);
      g.restore();
      return;
    }

    const spread = smooth((age - bird.duration) / 0.48);
    ellipse(g, '#292520', landing.x, landing.y + 1, 5 * scale, 1.3 * scale);
    ellipse(g, '#68252a', landing.x + scale, landing.y + 1, mix(2, 5, spread) * scale, 1.3 * scale);
    if (spread > 0.35) pixels(g, '#8c3236', landing.x + bird.direction * 5 * scale, landing.y + 2, 2);
    g.save();
    g.translate(landing.x, landing.y);
    g.scale(bird.direction * scale, scale);
    polygon(g, colors.tip, [[-2, -2], [-7, 0], [-6, 1], [-2, 0]]);
    pixels(g, colors.body, -3, -3, 6, 4);
    polygon(g, colors.wing, [[0, -3], [-1, -1], [-5, 2], [-2, 2], [2, -1]]);
    pixels(g, colors.body, 2, -2, species === 'stork' ? 4 : 2, 3);
    pixels(g, colors.beak, species === 'stork' ? 6 : 4, 0, species === 'stork' ? 4 : 2);
    pixels(g, colors.tip, 3, -1);
    pixels(g, '#922d36', 1, 0, 2);
    g.restore();
  }

  function fallingBirdPosition(bird, motion) {
    if (bird.landed) return bird.landing;
    const t = clamp((motion - bird.started) / bird.duration);
    const phase = t * bird.turns * Math.PI * 2;
    const envelope = Math.sin(Math.PI * t);
    return { x: mix(bird.x, bird.landing.x, t) + Math.sin(phase) * envelope * 10,
      y: mix(bird.y, bird.landing.y - 1, t * (0.43 + 0.57 * t)) + Math.cos(phase) * envelope * 5 };
  }

  function actorFireKey(actor) {
    return actor.resident || actor.animal || actor.bird || actor.camp;
  }

  function inFlame(jet, x, y, padding = 0) {
    const dx = x - jet.x;
    const dy = y - jet.y;
    const depth = dx * jet.dx + dy * jet.dy;
    return depth >= -padding && depth <= flameRange + padding &&
      Math.abs(dx * jet.dy - dy * jet.dx) <= 3 + Math.max(0, depth) * 0.21 + padding;
  }

  function makeFire(kind, motion, radius, height) {
    const duration = kind === 'prop' ? 3.5 + radius * 0.035 : kind === 'ground' ? 1.25 : 2.5;
    return { kind, radius, height, started: motion, smokeAt: motion + duration,
      ashAt: motion + duration + (kind === 'prop' ? 2.3 : 1.65) };
  }

  function igniteGroundActor(world, actor, key, jet, motion) {
    const bird = actor.kind === 'fallenBird' ? actor.bird : null;
    const place = bird ? fallingBirdPosition(bird, motion) : actor;
    const living = actor.kind === 'person' || Boolean(actor.animal);
    const lift = actor.kind === 'person' ? 7 : living ? 4 : 1;
    if (!inFlame(jet, place.x, place.y - lift, living ? 4 : 3)) return;
    const kind = living ? 'living' : bird ? 'bird' : 'object';
    const fire = makeFire(kind, motion, living ? 6 : 5, living ? 15 : 9);
    fire.actor = { ...actor, fleeing: living, working: false, sleeping: false, seated: false,
      attacked: false, biting: false, ranger: false, alpha: 1 };
    if (living && !fire.actor.speed) fire.actor.speed = 5;
    fire.heading = Math.atan2(place.y - jet.y, place.x - jet.x);
    world.fires.set(key, fire);
    if (actor.animal) {
      const hunt = world.rabidAnimals.get(actor.animal);
      if (hunt?.prey && !world.fires.has(hunt.target)) {
        world.residentPoses.set(hunt.target, { ...hunt.prey, fleeing: false, attacked: false, moving: false });
      }
      world.rabidAnimals.delete(actor.animal);
    }
  }

  function igniteJetTargets(world, actors, motion) {
    const jet = world.jet;
    if (!jet || !world.ranger) return;
    for (const actor of actors) {
      const key = actorFireKey(actor);
      if (key && key !== world.ranger.resident && !world.fires.has(key) && (actor.alpha ?? 1) >= 0.16) {
        igniteGroundActor(world, actor, key, jet, motion);
      }
    }
    for (const flyer of world.flameFlyers) {
      if (!inFlame(jet, flyer.x, flyer.y, 3)) continue;
      const random = randomFrom(hash(world.code + '/огонь/' + world.fallenBirds.length));
      const bird = dropBird(world, flyer, motion, random);
      const fire = makeFire('bird', motion, 5, 9);
      fire.actor = { kind: 'fallenBird', bird, y: bird.landing.y };
      world.fires.set(bird, fire);
    }

    const left = Math.max(0, Math.floor(Math.min(jet.x, jet.x + jet.dx * flameRange) - 14));
    const right = Math.min(W - 1, Math.ceil(Math.max(jet.x, jet.x + jet.dx * flameRange) + 14));
    const top = Math.max(0, Math.floor(Math.min(jet.y, jet.y + jet.dy * flameRange) - 14));
    const bottom = Math.min(H - 1, Math.ceil(Math.max(jet.y, jet.y + jet.dy * flameRange) + 14));
    for (const [i, item] of world.sceneItems.entries()) {
      if (item.ash || world.fires.has(item)) continue;
      const sprite = layers.night.sprites[i];
      const x0 = Math.max(left, sprite.left);
      const x1 = Math.min(right, sprite.left + sprite.canvas.width - 1);
      const y0 = Math.max(top, sprite.top);
      const y1 = Math.min(bottom, sprite.top + sprite.canvas.height - 1);
      if (x0 > x1 || y0 > y1) continue;
      const data = spritePixels(sprite);
      let hit = false;
      for (let y = y0; y <= y1 && !hit; y++) {
        for (let x = x0; x <= x1; x++) {
          if (data[((y - sprite.top) * sprite.canvas.width + x - sprite.left) * 4 + 3] >= 128 && inFlame(jet, x, y)) {
            hit = true;
            break;
          }
        }
      }
      if (!hit) continue;
      item.burning = true;
      delete item.cataclysm;
      shadowPosition = -1;
      const radius = clamp((item.width || sprite.canvas.width - 13) * 0.42, 3, 24);
      const height = clamp((item.height || item.y - sprite.top) * 0.7, 6, 64);
      world.fires.set(item, makeFire('prop', motion, radius, height));
    }

    const grid = 11;
    for (let y = Math.ceil(top / grid) * grid; y <= bottom; y += grid) {
      for (let x = Math.ceil(left / grid) * grid; x <= right; x += grid) {
        const key = y * W + x;
        if (world.groundFires.has(key) || y < world.fringe(x) + 2 || !inFlame(jet, x, y - 2, 2)) continue;
        world.groundFires.set(key, { ...makeFire('ground', motion, 5, 5), x, y });
      }
    }
  }

  function applyFireDamage(world, actors, motion, dt) {
    const visible = actors.filter(actor => actor.bird || !world.fires.has(actorFireKey(actor)));
    let changed = false;
    const obstacles = world.fires.size ? groundObstacles(world) : [];
    for (const [key, fire] of world.fires) {
      if (fire.kind === 'prop') {
        if (motion < fire.ashAt) continue;
        key.ash = fire.radius;
        delete key.burning;
        world.fires.delete(key);
        const index = world.sceneItems.indexOf(key);
        for (const [phase, layer] of Object.entries(layers)) {
          layer.sprites[index] = paintSceneSprite(key, seasonalColors[phase]);
        }
        changed = true;
      } else if (fire.kind !== 'bird') {
        const actor = fire.actor;
        if (fire.kind === 'living' && motion < fire.ashAt && dt > 0) {
          const burning = motion < fire.smokeAt;
          const runningSpeed = actor.speed * 5;
          const travel = (burning ? runningSpeed : runningSpeed / 10) * dt;
          const steps = Math.max(1, Math.ceil(travel / 3.5));
          actor.fleeing = burning;
          for (let step = 0; step < steps; step++) {
            const x = actor.x;
            const y = actor.y;
            moveDuringChase(world, actor, fire.heading, travel / steps, obstacles);
            if (!actor.moving) break;
            fire.heading = Math.atan2(actor.y - y, actor.x - x);
          }
        } else if (motion >= fire.ashAt) actor.moving = false;
        visible.push({ kind: 'fireDamage', x: actor.x, y: actor.y, alpha: 1, fire, actor });
      }
    }
    if (changed) rebuildSceneMasks();
    for (const actor of visible) {
      if (actor.bird) actor.fire = world.fires.get(actor.bird);
    }
    return visible.sort((a, b) => a.y - b.y);
  }

  function drawAsh(g, x, y, radius, phase = 'day') {
    const [shade, ash, fleck] = ['#252427', '#4b4748', '#797272'].map(ink => seasonTone(ink, phase));
    ellipse(g, shade, x, y, radius, Math.max(1.5, radius * 0.25));
    ellipse(g, ash, x - radius * 0.12, y - radius * 0.12, radius * 0.72, Math.max(1, radius * 0.22));
    pixels(g, fleck, x - radius * 0.43, y - radius * 0.2, Math.max(1, radius * 0.24));
    pixels(g, fleck, x + radius * 0.23, y);
  }

  function drawBurnEffect(g, fire, x, y, motion) {
    const { radius, height, started, smokeAt, ashAt } = fire;
    if (motion >= ashAt) return;
    if (motion >= smokeAt) {
      const strength = 1 - smooth((motion - smokeAt) / (ashAt - smokeAt));
      const count = Math.ceil(clamp(radius * 0.65, 3, 16));
      for (let i = 0; i < count; i++) {
        const life = wrap((motion - smokeAt) * 0.72 + i * 0.618, 1);
        const px = x + Math.sin(i * 7.12 + life * 4) * radius * 0.54 + life * 8;
        const py = y - height * 0.36 - life * Math.max(13, height * 1.2);
        g.globalAlpha = strength * (1 - life) * 0.91;
        ellipse(g, '#f8ffff', px, py, 2 + life * (3 + radius * 0.27), 2 + life * 4);
        ellipse(g, '#ffffff', px - 1, py - 1, 1.4 + life * 2, 1 + life * 2);
      }
    } else {
      const strength = smooth((motion - started + 0.045) * 8);
      const count = Math.ceil(clamp(radius * 0.72, 3, 15));
      for (let i = 0; i < count; i++) {
        const px = x + (i / (count - 1) * 2 - 1) * radius * 0.85;
        const wave = Math.sin(i * 3.1 + motion * 23);
        const h = height * (0.56 + (i % 3) * 0.16 + wave * 0.17) * strength;
        const width = 1.6 + radius * 0.11;
        const base = y - (i % 3) * height * 0.08;
        polygon(g, '#eb6031', [[px - width, base], [px - width * 0.7, base - h * 0.52], [px + wave * width, base - h],
          [px + width, base - h * 0.33], [px + width * 0.8, base]]);
        polygon(g, '#ffd47a', [[px - width * 0.53, base], [px + wave, base - h * 0.61], [px + width * 0.46, base]]);
        if (h > 4) pixels(g, '#fff2ad', px, base - h * 0.21);
      }
    }
    g.globalAlpha = 1;
  }

  function drawBurningProp(g, item, fire, motion, drawSprite) {
    const collapsing = smooth((motion - fire.smokeAt) / (fire.ashAt - fire.smokeAt));
    g.save();
    g.translate(0, item.y * collapsing * 0.73);
    g.scale(1, 1 - collapsing * 0.73);
    g.filter = 'saturate(' + (1 - collapsing) + ') brightness(' + (1 - collapsing * 0.73) + ')';
    drawSprite();
    g.restore();
    drawBurnEffect(g, fire, item.x, item.y, motion);
  }

  function drawScorchedGround(g, world, motion) {
    for (const fire of world.groundFires.values()) {
      ellipse(g, '#50423a', fire.x, fire.y, 6.3, 3.4);
      if (motion >= fire.ashAt) pixels(g, '#70665d', fire.x - 2, fire.y, 2);
      else if ((fire.x + fire.y) % 4 === 0) drawBurnEffect(g, fire, fire.x, fire.y, motion);
    }
  }

  function drawRangerJet(g, jet, motion) {
    const { x, y, dx, dy } = jet;
    for (let i = 0; i < 48; i++) {
      const age = wrap(motion * 2.9 + i * 0.618, 1);
      const distance = age * flameRange;
      const side = Math.sin(i * 3.76 + motion * 20) * age * 9.7;
      const radius = 1.8 + age * 4;
      g.globalAlpha = (1 - age * 0.74) * 0.78;
      const color = age < 0.16 ? '#fff6c3' : age < 0.49 ? '#ffc668' : age < 0.76 ? '#ff8a42' : '#d64f30';
      ellipse(g, color, x + dx * distance - dy * side, y + dy * distance + dx * side, radius, radius * 0.8);
    }
    g.globalAlpha = 1;
    trace(g, '#fff3b8', x, y, x + dx * 10, y + dy * 10, 2);
  }

  const cataclysmTypes = {
    lightning: { warning: 0.75, damage: 2.8, rubble: ['#222124', '#39302d', '#6a4735'] },
    meteor: { warning: 1.1, damage: 1.45, rubble: ['#382524', '#66433b', '#bd5938'] },
    ice: { warning: 1.05, damage: 1.65, rubble: ['#315367', '#6ba9bb', '#c9f3f4'] },
    tornado: { warning: 1.3, damage: 1.85, rubble: ['#45352d', '#8c6443', '#bf9261'] },
    volcano: { warning: 1.15, damage: 2.5, rubble: ['#3e2a2c', '#6b4240', '#b56a4a'] },
    sinkhole: { warning: 0.85, damage: 1.85, rubble: ['#2e2220', '#5b4030', '#9a7653'] },
    earthquake: { warning: 0.95, damage: 1.75, rubble: ['#3e3730', '#726251', '#a89674'] }
  };

  function sceneItemAt(world, point) {
    const x = Math.floor(point.x);
    const y = Math.floor(point.y);
    if (x < 0 || x >= W || y < 0 || y >= H || world.propPixels[(y * W + x) * 4 + 3] < 128) return null;
    const sprites = layers.night.sprites;
    for (let i = sprites.length - 1; i >= 0; i--) {
      const sprite = sprites[i];
      const { width, height } = sprite.canvas;
      const dx = x - sprite.left;
      const dy = y - sprite.top;
      if (dx < 0 || dx >= width || dy < 0 || dy >= height) continue;
      if (spritePixels(sprite)[(dy * width + dx) * 4 + 3] < 128) continue;
      return world.sceneItems[i];
    }
    return null;
  }

  function spritePixels(sprite) {
    const { width, height } = sprite.canvas;
    return sprite.hitPixels ??= sprite.canvas.getContext('2d').getImageData(0, 0, width, height).data;
  }

  function residentAt(world, point, prop) {
    for (let i = world.groundActors.length - 1; i >= 0; i--) {
      const actor = world.groundActors[i];
      if (actor.kind !== 'person' || !actor.resident || actor.attacked || actor.alpha < 0.2 ||
        (prop && actor.y <= prop.y)) continue;
      const scale = groundActorScale(actor.y);
      const height = actor.seated ? 12 : 16;
      const up = actor.y - point.y;
      if (Math.abs(actor.x - point.x) <= 4 * scale + 1 && up >= -1 && up <= height * scale) return actor;
    }
    return null;
  }

  function animalAt(world, point, prop) {
    for (let i = world.groundActors.length - 1; i >= 0; i--) {
      const actor = world.groundActors[i];
      if (!actor.animal || actor.alpha < 0.2 || (prop && actor.y <= prop.y)) continue;
      const scale = groundActorScale(actor.y);
      const { body, height, legs } = animalDimensions(actor.kind);
      const dx = (point.x - actor.x) * actor.direction / scale;
      const dy = (actor.y - point.y) / scale;
      const tail = Math.max(body * 0.7 + 2, actor.kind === 'dog' || actor.kind === 'fox' ? 10 : 0);
      const head = Math.max(body * 0.55 + 4, actor.kind === 'deer' ? 10 : 0);
      const top = actor.sleeping ? 6 : legs + height + (actor.kind === 'deer' || actor.kind === 'hare' ? 7 : 4);
      if (dx >= -tail && dx <= head && dy >= -1.5 && dy <= top) return actor;
    }
    return null;
  }

  function startCataclysm(world, house, motion) {
    if (house.cataclysm || houseHasDamage(house)) return;
    if (!world.cataclysmDeck.length) world.cataclysmDeck = Object.keys(cataclysmTypes);
    const index = integer(world.cataclysmRandom, 0, world.cataclysmDeck.length - 1);
    const [kind] = world.cataclysmDeck.splice(index, 1);
    const random = randomFrom(house.seed);
    const { front, depth, wall, roof, rise } = dimensions(house);
    house.cataclysm = { kind, started: motion, struck: false,
      half: (front + depth) / 2 + 3, roofY: house.y - wall - roof - rise,
      side: house.x < W / 2 ? 1 : -1,
      particles: Array.from({ length: 25 }, () => ({
        x: between(random, -1, 1), speed: between(random, 11, 43),
        lift: between(random, 14, 66), size: integer(random, 1, 4), phase: random()
      })) };
    playSceneSound(kind, 'warning', house.x);
  }

  function houseHasDamage(house) {
    return Boolean(house.ash || house.burning || house.ruin || house.cataclysm?.struck);
  }

  function updateCataclysms(world, motion) {
    let impacted = false;
    let finished = false;
    for (const house of world.houses) {
      const event = house.cataclysm;
      if (!event) continue;
      const { warning, damage } = cataclysmTypes[event.kind];
      const age = motion - event.started;
      if (age >= warning + damage) {
        house.ruin = event.kind;
        delete house.cataclysm;
        const index = world.sceneItems.indexOf(house);
        for (const [phase, layer] of Object.entries(layers)) {
          layer.sprites[index] = paintSceneSprite(house, seasonalColors[phase]);
        }
        finished = true;
      } else if (age >= warning && !event.struck) {
        event.struck = true;
        playSceneSound(event.kind, 'impact', house.x);
        impacted = true;
      }
    }
    if (finished) {
      rebuildSceneMasks();
      updateSceneCursor();
    } else if (impacted) {
      world.moonMasks = paintMoonlight(world);
      shadowPosition = -1;
    }
  }

  function drawSceneSprite(g, sprite, other, blend) {
    g.drawImage(sprite.canvas, sprite.left, sprite.top);
    if (!other) return;
    const alpha = g.globalAlpha;
    g.globalAlpha = alpha * blend;
    g.drawImage(other.canvas, other.left, other.top);
    g.globalAlpha = alpha;
  }

  function drawCracks(g, x, y, half, strength, ink) {
    for (const side of [-1, 1]) {
      const reach = half * side * strength;
      trace(g, ink, x, y, x + reach * 0.41, y + 3 * strength);
      trace(g, ink, x + reach * 0.41, y + 3 * strength, x + reach * 0.73, y - 2 * strength);
      trace(g, ink, x + reach * 0.73, y - 2 * strength, x + reach, y + side * 6 * strength);
      trace(g, ink, x + reach * 0.41, y + 3 * strength, x + reach * 0.61, y + 8 * strength);
    }
  }

  function drawQuakeFault(g, house, half, progress, phase) {
    const { x, y } = house;
    const endX = x + half * 0.85 * progress;
    const endY = y + 13 * progress;
    const turnX = x + half * 0.24 * progress;
    const turnY = y + 8 * progress;
    const [edge, dark, light] = ['#59443a', '#3c302c', '#aa8866'].map(ink => seasonTone(ink, phase));
    drawCracks(g, x, y + 2, half + 13, progress, edge);
    trace(g, edge, x - half * 0.26 * progress, y + 1, turnX, turnY, 2);
    trace(g, dark, turnX, turnY, endX, endY, 2);
    trace(g, light, turnX, turnY + 2, endX, endY + 1);
  }

  function drawHouseRuins(g, house, kind, palette, progress) {
    if (progress <= 0) return;
    const { x, y } = house;
    const { front, depth, wall } = dimensions(house);
    const half = (front + depth) * 0.52 + 3;
    const [dark, mid, pale] = cataclysmTypes[kind].rubble.map(ink => seasonTone(ink, palette.phase));
    const crater = kind === 'sinkhole' || kind === 'meteor';
    const height = (kind === 'volcano' ? wall + 6 : kind === 'lightning' ? wall * 0.72 : wall * 0.48) * progress;
    ellipse(g, mid, x, y + 1, half * progress, 4.5);
    ellipse(g, dark, x, y, half * 0.89 * progress, crater ? 3.5 : 2.5);
    if (kind === 'earthquake') drawQuakeFault(g, house, half, progress, palette.phase);
    if (kind === 'sinkhole') drawCracks(g, x, y, half + 4, progress, dark);
    if (kind === 'volcano') {
      polygon(g, dark, [[x - half, y + 2], [x - half * 0.56, y - height * 0.66],
        [x - half * 0.16, y - height], [x + half * 0.27, y - height * 0.85],
        [x + half * 0.55, y - height * 0.48], [x + half, y + 2]]);
      polygon(g, mid, [[x - half * 0.54, y - height * 0.62], [x - half * 0.16, y - height],
        [x + half * 0.27, y - height * 0.85], [x + half * 0.35, y - height * 0.55], [x, y - 2]]);
    }
    const random = randomFrom(house.seed ^ 1187);
    for (let i = 0; i < 15; i++) {
      const dx = between(random, -half * 0.9, half * 0.9);
      const width = integer(random, 2, 7);
      const raise = between(random, 0.25, 1) * height * (crater ? 0.35 : 1);
      const px = x + dx * progress;
      const py = y - raise * (1 - Math.abs(dx) / (half * 1.4));
      polygon(g, i % 3 === 0 ? mid : dark, [[px - width * 0.5, y + i % 3], [px - 1, py],
        [px + 2, py - 1], [px + width * 0.5, y + i % 3]]);
      if (i % 2 === 0) pixels(g, pale, px, py, kind === 'ice' ? 2 : 1);
    }
    if (kind === 'lightning') {
      for (const dx of [-0.42, 0.34]) trace(g, dark, x + half * dx, y, x + half * dx - 1, y - height, 2);
    }
  }

  function drawCollapsingWalls(g, house, event, t, drawSprite) {
    const { x, y } = house;
    const { wall } = dimensions(house);
    const spread = smooth(t);
    const lift = Math.sin(t * Math.PI);
    for (const section of [-1, 0, 1]) {
      const roof = section === 0;
      const drift = roof ? event.side : section;
      g.save();
      g.translate(x + drift * (roof ? 30 : 19) * spread, y + (roof ? -30 : -9) * lift + 10 * t);
      g.rotate(drift * spread * (roof ? 1.4 : 1.04));
      g.translate(-x, -y);
      g.beginPath();
      if (roof) g.rect(x - event.half - 6, event.roofY - 12, event.half * 2 + 12, y - wall - event.roofY + 12);
      else g.rect(section < 0 ? x - event.half - 6 : x, y - wall, event.half + 6, wall + 7);
      g.clip();
      g.globalAlpha = 1 - smooth((t - 0.58) / 0.42);
      drawSprite();
      g.restore();
    }
  }

  function drawHouseCataclysm(g, house, palette, motion, drawSprite) {
    const event = house.cataclysm;
    const { kind, half } = event;
    const { warning, damage } = cataclysmTypes[kind];
    const age = motion - event.started;
    const { x, y } = house;
    const shake = Math.sin(age * 52) * Math.sin(age * 33);
    if (!event.struck) {
      const progress = smooth(age / warning);
      if (kind === 'earthquake') drawQuakeFault(g, house, half, progress, palette.phase);
      if (kind === 'sinkhole') {
        drawCracks(g, x, y + 2, half + 8, progress, '#49382e');
        ellipse(g, '#392c28', x, y + 1, Math.max(1, half * 0.85 * progress), 2.7);
      }
      g.save();
      if (kind === 'earthquake') g.translate(Math.round(shake * 2), 0);
      drawSprite();
      g.restore();
      return;
    }

    const t = clamp((age - warning) / damage);
    const collapse = smooth(t * (kind === 'lightning' || kind === 'volcano' ? 1 : 1.35));
    if (kind !== 'volcano') drawHouseRuins(g, house, kind, palette, collapse);
    if (kind === 'tornado') {
      drawCollapsingWalls(g, house, event, t, drawSprite);
      return;
    }
    g.save();
    if (kind === 'sinkhole') {
      g.beginPath();
      g.rect(x - half - 9, event.roofY - 13, half * 2 + 18, y - event.roofY + 13);
      g.clip();
      g.translate(x + shake * (1 - t), y + collapse * (y - event.roofY + 9));
    } else {
      g.translate(x + (kind === 'earthquake' ? Math.round(shake * (1 - t) * 5) : 0), y);
      if (kind === 'earthquake') g.rotate(shake * 0.12 * (1 - t) + event.side * collapse * 0.22);
      g.scale(1, kind === 'volcano' ? 1 : 1 - collapse * 0.82);
    }
    g.translate(-x, -y);
    g.globalAlpha = 1 - smooth((t - 0.48) / 0.52);
    if (kind === 'lightning') g.filter = 'brightness(' + mix(1, 0.15, smooth(t * 1.9)) + ') saturate(0.23)';
    if (kind === 'ice') g.filter = 'grayscale(0.75) brightness(1.45)';
    drawSprite();
    g.restore();
    if (kind === 'volcano') drawHouseRuins(g, house, kind, palette, collapse);
  }

  function drawLightningStrike(g, house, event, windup, after) {
    const { x } = house;
    const cloudY = Math.max(12, event.roofY - 100);
    g.globalAlpha = 0.78 * smooth(windup * 3) * (1 - smooth(after));
    ellipse(g, '#3e435d', x, cloudY, 42, 10);
    ellipse(g, '#5a5c73', x - 16, cloudY - 5, 21, 9);
    ellipse(g, '#494b62', x + 17, cloudY - 3, 21, 9);
    if (windup >= 0.89 && after < 0.14) {
      const points = [[x - 16, cloudY], [x + 5, mix(cloudY, event.roofY, 0.29)],
        [x - 9, mix(cloudY, event.roofY, 0.46)], [x + 9, mix(cloudY, event.roofY, 0.72)], [x, event.roofY + 2]];
      g.globalAlpha = (1 - after / 0.14) * 0.27;
      ellipse(g, '#e3e2ff', x, event.roofY - 3, 31, 23);
      g.globalAlpha = 1 - after / 0.14;
      for (let i = 1; i < points.length; i++) {
        trace(g, '#878fe7', ...points[i - 1], ...points[i], 4);
        trace(g, '#fff8e8', ...points[i - 1], ...points[i], 2);
      }
      trace(g, '#c8ceff', ...points[2], x - 27, event.roofY - 17);
    }
    g.globalAlpha = 1;
  }

  function drawFallingMass(g, house, event, progress) {
    const ice = event.kind === 'ice';
    const t = progress * (0.46 + 0.54 * progress);
    const drift = event.side * (ice ? 26 : 91);
    const x = house.x + drift * (1 - t);
    const y = mix(8, event.roofY + 4, t);
    const ink = ice ? ['#5f9fba', '#c8f3f6', '#efffff'] : ['#6d3b36', '#ec6533', '#ffbf61'];
    for (const mote of event.particles) {
      const reach = mote.phase * (ice ? 31 : 53);
      g.globalAlpha = (1 - mote.phase) * 0.85;
      const px = x + event.side * reach * (ice ? 0.22 : 0.57) + mote.x * 5;
      const py = y - reach;
      trace(g, ink[mote.size % 3], px, py, px + event.side * 2, py - mote.size * 2, mote.size > 2 ? 2 : 1);
    }
    g.globalAlpha = 1;
    polygon(g, ink[0], [[x - 9, y - 4], [x - 3, y - 10], [x + 6, y - 7],
      [x + 10, y + 1], [x + 4, y + 9], [x - 5, y + 7]]);
    polygon(g, ink[1], [[x - 9, y - 4], [x - 3, y - 10], [x + 6, y - 7], [x + 3, y + 4], [x - 5, y + 7]]);
    trace(g, ink[2], x - 6, y - 4, x - 2, y - 8, 2);
  }

  function drawFunnel(g, house, event, windup, after, motion) {
    const strength = smooth(windup * 4) * (1 - smooth((after - 0.6) / 1.25));
    const baseX = house.x + event.side * (1 - windup) * 68 + Math.sin(motion * 7) * 4;
    g.globalAlpha = 0.9 * strength;
    for (let i = 0; i < 20; i++) {
      const t = i / 19;
      const y = house.y - t * 127;
      const x = baseX + event.side * t * 29 + Math.sin(t * 8 + motion * 10) * mix(2, 7, t);
      const width = mix(5, 38, t ** 0.72);
      ellipse(g, i % 3 ? '#666a63' : '#94958a', x, y, width, mix(2.6, 8, t));
      pixels(g, '#bab6a2', x + Math.sin(motion * 21 + i) * width * 0.64, y - 1, 4);
    }
    for (const mote of event.particles) {
      const t = wrap(motion * 0.95 + mote.phase, 1);
      const x = baseX + event.side * t * 29 + Math.sin(motion * 18 + mote.phase * 19) * mix(9, 46, t);
      pixels(g, mote.size % 2 ? '#453c36' : '#d1b28a', x, house.y - t * 118, mote.size + 1, 2);
    }
    g.globalAlpha = 1;
  }

  function drawEruption(g, house, event, windup, after, motion) {
    const strength = smooth(windup * 4) * (1 - smooth((after - 0.75) / 1.75));
    const ventX = house.x + event.side * (event.half + 8);
    const { y } = house;
    g.globalAlpha = strength;
    polygon(g, '#503130', [[ventX - 14, y + 3], [ventX - 6, y - 10],
      [ventX + 4, y - 12], [ventX + 15, y + 3]]);
    ellipse(g, '#f68b45', ventX, y - 9, 5, 2.5);
    for (const mote of event.particles) {
      const t = wrap(motion * 0.82 + mote.phase, 1);
      const ashX = mix(ventX, house.x + mote.x * event.half, t);
      const ashY = mix(y - 9, event.roofY + 17, t) - Math.sin(t * Math.PI) * (43 + mote.lift * 0.48);
      if (mote.size >= 3) {
        g.globalAlpha = strength * (0.66 - t * 0.35);
        ellipse(g, '#574344', ashX, ashY, mote.size + t * 5, mote.size + t * 2);
      } else {
        g.globalAlpha = strength * (1 - t * 0.48);
        trace(g, mote.size === 1 ? '#ffbb55' : '#db602e', ashX, ashY, ashX + event.side * 3, ashY - 3, 2);
      }
    }
    g.globalAlpha = 1;
  }

  function drawHouseFire(g, house, event, after) {
    const strength = smooth(after * 3.3) * (1 - smooth((after - 1.45) / 1.35));
    const { x, y } = house;
    for (let i = 0; i < 8; i++) {
      const flicker = 0.79 + Math.sin(after * 24 + i * 3) * 0.21;
      const px = x + event.half * mix(-0.84, 0.84, i / 7);
      const base = y - (i % 3) * 3;
      const height = (y - event.roofY) * strength * flicker * (0.65 + i % 4 * 0.21);
      if (height < 2) continue;
      polygon(g, '#d55c2e', [[px - 4, base], [px - 3, base - height * 0.55], [px + flicker, base - height],
        [px + 4, base - height * 0.36], [px + 3, base]]);
      polygon(g, '#ffce6b', [[px - 2, base], [px, base - height * 0.56], [px + 2, base]]);
    }
    for (const mote of event.particles) {
      const t = wrap(after * 0.93 + mote.phase, 1);
      const px = x + mote.x * event.half + t * 13;
      const py = y - t * (y - event.roofY + mote.lift);
      g.globalAlpha = strength * (1 - t) * 0.72;
      if (mote.size >= 3) ellipse(g, '#3c353b', px, py, 3 + t * 7, 2 + t * 4);
      else pixels(g, '#ffa74d', px, py, mote.size, 2);
    }
    g.globalAlpha = 1;
  }

  function drawImpactDust(g, house, event, after) {
    if (after < 0 || after > 1.2) return;
    const { x, y } = house;
    const [dark, mid, pale] = cataclysmTypes[event.kind].rubble;
    const flash = 1 - smooth(after / 0.27);
    if (event.kind === 'meteor' || event.kind === 'ice') {
      g.globalAlpha = flash * 0.83;
      ellipse(g, pale, x, mix(event.roofY, y, after * 0.6), event.half * (0.9 + after), 7 + after * 16);
    }
    for (const mote of event.particles) {
      const t = after - mote.phase * 0.18;
      if (t < 0) continue;
      const px = x + mote.x * (event.half * 0.5 + mote.speed * t);
      const py = y - 3 - Math.max(0, t * mote.lift - 44 * t ** 2);
      g.globalAlpha = (1 - smooth(t / 1.2)) * 0.86;
      if (mote.size === 4) ellipse(g, mid, px, py, 3 + t * 5, 2 + t * 3);
      else pixels(g, mote.size === 2 ? dark : pale, px, py, mote.size, 2);
    }
    g.globalAlpha = 1;
  }

  function drawCataclysms(g, world, motion) {
    for (const house of world.houses) {
      const event = house.cataclysm;
      if (!event) continue;
      const { warning } = cataclysmTypes[event.kind];
      const after = motion - event.started - warning;
      const windup = clamp(1 + after / warning);
      switch (event.kind) {
        case 'lightning':
          drawLightningStrike(g, house, event, windup, Math.max(0, after));
          if (after >= 0) drawHouseFire(g, house, event, after);
          break;
        case 'meteor':
        case 'ice':
          if (after < 0) drawFallingMass(g, house, event, windup);
          else drawImpactDust(g, house, event, after);
          break;
        case 'tornado': drawFunnel(g, house, event, windup, Math.max(0, after), motion); break;
        case 'volcano': drawEruption(g, house, event, windup, Math.max(0, after), motion); break;
        default: drawImpactDust(g, house, event, after);
      }
    }

      for (let i = 0; i < data.length; i++) {

    }
    const compressor = context.createDynamicsCompressor();
    compressor.threshold.value = -21;

    compressor.ratio.value = 3;
    compressor.attack.value = 0.012;
    compressor.release.value = 0.24;
    music.master = context.createGain();

    music.master.connect(compressor);
    sceneAudio.input = context.createGain();
    sceneAudio.input.gain.value = 0.68;
    sceneAudio.input.connect(compressor);
    compressor.connect(context.destination);
    music.context = context;

  function createMusicBus(name) {
    const c = music.context;
    const score = musicScores[name];
    const input = c.createGain();
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 7200;
    const output = c.createGain();
    const convolver = c.createConvolver();
    convolver.buffer = music.impulse;
    const reverb = c.createGain();
    reverb.gain.value = name === 'winter' ? 0.29 : 0.17;
    const delay = c.createDelay(2);
    delay.delayTime.value = 60 / score.bpm * 0.75;
    const feedback = c.createGain();
    feedback.gain.value = name === 'winter' ? 0.33 : 0.22;
    const echo = c.createGain();
    echo.gain.value = name === 'winter' ? 0.22 : 0.12;
    input.connect(filter);
    filter.connect(output);
    input.connect(convolver);
    convolver.connect(reverb);
    reverb.connect(output);
    input.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(echo);
    echo.connect(output);
    output.connect(music.master);
    output.gain.setValueAtTime(0, c.currentTime);
    output.gain.linearRampToValueAtTime(0.84, c.currentTime + 1.5);
    return { name, input, output, score, voices: new Set(), row: 0, nextTime: c.currentTime + 0.04,
      nodes: [input, filter, output, convolver, reverb, delay, feedback, echo] };
  }

  function holdMusicGain(parameter, time) {
    if (typeof parameter.cancelAndHoldAtTime === 'function') {
      parameter.cancelAndHoldAtTime(time);
      return;
    }
    const value = parameter.value;
    parameter.cancelScheduledValues(time);
    parameter.setValueAtTime(value, time);
  }

  function retireMusicBus(bus) {
    const now = music.context.currentTime;
    holdMusicGain(bus.output.gain, now);
    bus.output.gain.linearRampToValueAtTime(0, now + 1.65);
    bus.stopAt = now + 1.8;
    music.retiring.push(bus);
  }

    music.bus = createMusicBus(season);

    const voice = { sources, nodes: [...sources, ...nodes, panner] };
    bus.voices.add(voice);
    sources[0].onended = () => {
      for (const node of voice.nodes) node.disconnect();

    for (const source of sources) {

  function scheduleSceneCue(cue, time, pan) {
    const { from, to, duration, level, attack = 0.005, sustain, delay = 0, filter, resonance = 0.68, waveform, peakFrequency } = cue;
    const c = music.context;
    const start = time + delay;
    const end = start + duration;
    const gain = c.createGain();
    const nodes = [gain];
    let source;
    if (filter) {
      source = c.createBufferSource();
      source.buffer = music.noise;
      source.loop = true;
      source.loopStart = Math.random() * 0.18;
      const band = c.createBiquadFilter();
      band.type = filter;
      band.Q.value = resonance;
      band.frequency.setValueAtTime(from, start);
      band.frequency.exponentialRampToValueAtTime(to, end);
      source.connect(band);
      band.connect(gain);
      nodes.push(band);
    } else {
      source = c.createOscillator();
      source.type = waveform;
      source.frequency.setValueAtTime(from, start);
      if (peakFrequency) {
        source.frequency.exponentialRampToValueAtTime(peakFrequency, start + duration * 0.34);
        source.frequency.exponentialRampToValueAtTime(peakFrequency * 0.96, start + duration * 0.66);
      }
      source.frequency.exponentialRampToValueAtTime(to, end);
      source.connect(gain);
    }
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(level, start + attack);
    if (sustain) gain.gain.setValueAtTime(level, start + sustain);
    gain.gain.exponentialRampToValueAtTime(0.00015, end - 0.008);
    gain.gain.linearRampToValueAtTime(0, end);
    connectVoice(sceneAudio, [source], nodes, gain, pan, start, end);
  }

  async function playSceneSound(kind, stage, x) {
    if (paused || document.hidden) return;
    const scene = world;
    try {
      if (!music.context) initAudio();
      const c = music.context;
      if (c.state !== 'running') await c.resume();
      if (world !== scene || paused || document.hidden) return;
      const time = c.currentTime + 0.008;
      const pan = (x / W * 2 - 1) * 0.55;
      for (const cue of sceneSounds[kind][stage]) scheduleSceneCue(cue, time, pan);
    } catch (error) {
      console.warn('Не удалось воспроизвести звуковой эффект', error);
    }
  }

  function musicNote(bus, midi, time, duration, instrument, level, pan = 0) {
    const c = music.context;
    const frequency = 440 * 2 ** ((midi - 69) / 12);
    const oscillator = c.createOscillator();
    const envelope = c.createGain();
    const filter = c.createBiquadFilter();
    const sources = [oscillator];
    const nodes = [envelope, filter];
    const pad = instrument === 'pad';
    const bell = instrument === 'bell';
    const attack = pad ? 0.28 : instrument === 'reed' ? 0.055 : 0.009;
    const release = pad ? 0.85 : bell ? 1.45 : instrument === 'flute' ? 0.23 : 0.12;
    const end = time + duration + release;
    oscillator.type = instrument === 'pluck' || instrument === 'reed' ? 'square' : 'triangle';
    if (bell || instrument === 'flute') oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(frequency, time);
    filter.type = 'lowpass';
    filter.Q.value = 0.5;
    filter.frequency.setValueAtTime(pad ? 950 : instrument === 'bass' ? 700 : bus.score.brightness, time);
    if (instrument === 'pluck') {
      filter.frequency.exponentialRampToValueAtTime(700, time + duration + 0.08);
    }
    envelope.gain.setValueAtTime(0, time);
    envelope.gain.linearRampToValueAtTime(level, time + Math.min(attack, duration * 0.45));
    envelope.gain.exponentialRampToValueAtTime(Math.max(0.0001, level * (bell ? 0.12 : pad ? 0.76 : 0.44)), time + duration);
    envelope.gain.exponentialRampToValueAtTime(0.0001, end - 0.015);
    envelope.gain.linearRampToValueAtTime(0, end);
    oscillator.connect(filter);
    if (pad) {
      const second = c.createOscillator();
      second.type = 'triangle';
      second.frequency.setValueAtTime(frequency, time);
      second.detune.value = 7;
      oscillator.detune.value = -6;
      second.connect(filter);
      sources.push(second);
    }
    if (bell || instrument === 'flute' || instrument === 'reed') {
      const modulation = c.createOscillator();
      const amount = c.createGain();
      modulation.frequency.value = bell ? frequency * 1.414 : 4.6;
      amount.gain.setValueAtTime(bell ? frequency * 1.7 : frequency * 0.004, time);
      if (bell) amount.gain.exponentialRampToValueAtTime(frequency * 0.025, time + duration + 1);
      modulation.connect(amount);
      amount.connect(oscillator.frequency);
      sources.push(modulation);
      nodes.push(amount);
    }
    filter.connect(envelope);
    connectVoice(bus, sources, nodes, envelope, pan, time, end);
  }

  function musicDrum(bus, kind, time, level) {
    const c = music.context;
    const gain = c.createGain();
    if (kind === 'kick') {
      const oscillator = c.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(112, time);
      oscillator.frequency.exponentialRampToValueAtTime(43, time + 0.13);
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(level, time + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.28);
      oscillator.connect(gain);
      connectVoice(bus, [oscillator], [gain], gain, 0, time, time + 0.3);
      return;
    }
    const source = c.createBufferSource();
    source.buffer = music.noise;
    const filter = c.createBiquadFilter();
    filter.type = kind === 'hat' ? 'highpass' : 'bandpass';
    filter.frequency.value = kind === 'hat' ? 6500 : 1800;
    filter.Q.value = kind === 'hat' ? 0.5 : 0.7;
    const duration = kind === 'hat' ? 0.065 : 0.17;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(level, time + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
    source.connect(filter);
    filter.connect(gain);
    connectVoice(bus, [source], [gain, filter], gain, kind === 'hat' ? 0.28 : -0.12, time, time + duration + 0.01);
  }

  function scheduleMusicRow(bus) {
    const { row, nextTime: time, score } = bus;
    const step = 60 / score.bpm / 4;
    const bar = Math.floor(row / 16);
    const beat = row % 16;
    const chord = score.chords[bar % 8];
    const bright = bus.name === 'spring';
    if (beat === 0) {
      for (const [i, interval] of [0, 2, 4, 6].entries()) {
        musicNote(bus, musicDegree(score, chord + interval), time + i * 0.013,
          step * 14.7, 'pad', score.padLevel, (i - 1.5) * 0.28);
      }
    }
    if (beat === 0 || beat === 8) {
      musicNote(bus, musicDegree(score, chord + (beat === 8 ? 4 : 0)) - 12,
        time, step * (bright ? 3 : 6), 'bass', score.bassLevel);
    }
    const arpSpacing = bright ? 1 : 2;
    if (beat % arpSpacing === 0) {
      const order = bus.name === 'winter' ? [0, 4, 2, 6, 4, 2, 6, 2] : [0, 2, 4, 6, 4, 2, 6, 4];
      const degree = chord + 7 + order[(beat / arpSpacing) % 8];
      musicNote(bus, musicDegree(score, degree), time, step * 0.73,
        bus.name === 'winter' ? 'bell' : 'pluck', score.arpLevel, beat % 4 ? 0.42 : -0.42);
    }
    let degree = score.melody[bar % 8][beat];
    if (degree >= 0) {
      if (bar >= 8 && bar < 12 && beat < 8) degree += bright ? 2 : 1;
      const duration = step * (bright ? 0.95 : bus.name === 'winter' ? 3.4 : 2.65);
      musicNote(bus, musicDegree(score, degree), time, duration, score.lead, score.leadLevel, -0.08);
    }
    if (bright) {
      if (beat === 0 || beat === 8 || (bar % 4 === 3 && beat === 14)) musicDrum(bus, 'kick', time, 0.16);
      if (beat === 4 || beat === 12) musicDrum(bus, 'snare', time, 0.055);
      if (beat % 2 === 0) musicDrum(bus, 'hat', time, beat % 4 ? 0.025 : 0.018);
    } else if (bus.name === 'summer') {
      if (beat === 0) musicDrum(bus, 'kick', time, 0.095);
      if (beat === 12) musicDrum(bus, 'snare', time, 0.022);
      if (beat === 4 || beat === 10) musicDrum(bus, 'hat', time, 0.013);
    } else if (bus.name === 'autumn') {
      if (beat === 0 && bar % 2 === 0) musicDrum(bus, 'kick', time, 0.075);
      if (beat === 12) musicDrum(bus, 'snare', time, 0.018);
    } else if (beat === 0 && bar % 4 === 0) {
      musicDrum(bus, 'kick', time, 0.055);
    }
    bus.row = (row + 1) % 256;
    bus.nextTime += step;
  }

  function scheduleMusic() {
    const c = music.context;
    if (!c || c.state !== 'running' || !music.enabled || paused || document.hidden) return;
    const bus = music.bus;
    if (bus.nextTime < c.currentTime - 0.1) bus.nextTime = c.currentTime + 0.025;
    while (bus.nextTime < c.currentTime + 0.3) scheduleMusicRow(bus);
    music.retiring = music.retiring.filter(old => {
      if (old.stopAt > c.currentTime) return true;
      for (const voice of old.voices) {
        for (const source of voice.sources) source.stop();
        for (const node of voice.nodes) node.disconnect();
      }
      for (const node of old.nodes) node.disconnect();
      return false;
    });
  }

  function updateMusicButton() {
    musicButton.setAttribute('aria-pressed', music.enabled);
    const label = music.enabled ? 'Выключить музыку' : 'Включить музыку';
    musicButton.setAttribute('aria-label', label);
    musicButton.title = label;
  }

  function syncAudioPlayback() {
    music.operation = music.operation.then(async () => {
      const context = music.context;
      if (!context) return;
      if (!paused && !document.hidden) await context.resume();
      if (music.enabled && !paused && !document.hidden) {
        changeMusicSeason();
        const now = context.currentTime;
        holdMusicGain(music.master.gain, now);
        music.master.gain.linearRampToValueAtTime(music.volume, now + 0.12);
        if (!music.timer) music.timer = setInterval(scheduleMusic, 25);
        scheduleMusic();
      } else {
        clearInterval(music.timer);
        music.timer = null;
        const now = context.currentTime;
        holdMusicGain(music.master.gain, now);
        music.master.gain.linearRampToValueAtTime(0, now + 0.06);
        if (paused || document.hidden) {
          await new Promise(resolve => setTimeout(resolve, 75));
          if (paused || document.hidden) await context.suspend();
        }
      }
    }).catch(error => {
      console.error('Не удалось включить музыку', error);
      music.enabled = false;
      clearInterval(music.timer);
      music.timer = null;
      if (music.master) music.master.gain.setTargetAtTime(0, music.context.currentTime, 0.02);
      updateMusicButton();
      byId('music-status').hidden = false;
      byId('music-status').textContent = 'Не удалось включить звук. Нажмите «Музыка» ещё раз.';
    });
    return music.operation;
  }

  musicButton.addEventListener('click', () => {
    byId('music-status').hidden = true;
    try {
      if (!music.context) initAudio();
      music.enabled = !music.enabled;
      updateMusicButton();
      syncAudioPlayback();
    } catch {
      byId('music-status').hidden = false;
      byId('music-status').textContent = 'Этот браузер не поддерживает синтез музыки.';
      musicButton.disabled = true;
    }
  });
  musicVolume.addEventListener('input', () => {
    music.volume = musicVolume.valueAsNumber / 100 * 0.65;
    if (music.context?.state !== 'running' || !music.enabled || paused || document.hidden) return;
    music.master.gain.setTargetAtTime(music.volume, music.context.currentTime, 0.04);
  });

  let world;
  let layers;
  let simulatedMinutes = START_HOUR * 60;
  let motion = 0;
  let paused = false;
  let weather;
  let frame = 0;
  let lastRender = 0;
  let aimPointer;

  const currentWeather = () => weatherAt(world, simulatedMinutes / 60, weatherPicker.value, coverPicker.value);

  function showWeatherNow() {
    weather = currentWeather();
    render();
  }

  function render() {
    if (!world) return;
    updateCataclysms(world, motion);
    const hour = simulatedMinutes / 60;
    const light = lightingAt(hour);
    const clouds = cloudState(world, motion, weather.level);
    const sun = sunlightAt(world, hour, weather, clouds);
    const moon = moonlightAt(world, hour, weather, clouds);
    drawSky(world, light, motion, weather, clouds, sun, moon);
    drawLand(world, layers, light, hour, motion, weather, clouds, sun, moon);
    if (aimPointer && !paused) updateSceneCursor();
    drawCataclysms(ctx, world, motion);
    if (world.jet) drawRangerJet(ctx, world.jet, motion);
    if (world.shots.length) drawShots(ctx, world, motion);
    const minutes = Math.floor(simulatedMinutes);
    if (clock.valueAsNumber !== minutes) clock.value = minutes;
    const display = [Math.floor(minutes / 60), minutes % 60].map(value => String(value).padStart(2, '0')).join(':');
    if (byId('time-label').textContent !== display) byId('time-label').textContent = display;
    clock.setAttribute('aria-valuetext', display);
  }

  function tick(now) {
    frame = 0;
    const elapsed = now - lastRender;
    if (elapsed >= 40) {
      const dt = Math.min(elapsed / 1000, 0.15);
      lastRender = now;
      simulatedMinutes = wrap(simulatedMinutes + dt * DAY_MINUTES / DAY_SECONDS, DAY_MINUTES);
      motion += dt;
      const target = currentWeather();
      for (const key of Object.keys(weather)) weather[key] = mix(weather[key], target[key], 1 - Math.exp(-dt * 0.83));
      render();
    }
    startClock();
  }

  function startClock() {
    if (!frame && !paused && !document.hidden) frame = requestAnimationFrame(tick);
  }

  function resetClock() {
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
    lastRender = performance.now();
    startClock();
  }

  function freshCode() {
    return Array.from(crypto.getRandomValues(new Uint32Array(2)),
      value => value.toString(36).padStart(7, '0')).join('-');
  }

  const normalizeCode = value => Array.from(value.trim()).slice(0, 48).join('');

  function codeFromUrl() {
    try {
      return normalizeCode(decodeURIComponent(location.hash.slice(1)));
    } catch {
      return '';
    }
  }

  function selectVillage(code) {
    stopSceneSounds();
    rangerKeys.clear();
    world = generateWorld(code);
    world.population = createGroundPopulation(world);
    world.groundActors = [];
    world.ranger = null;
    world.residentPoses = new Map();
    world.fires = new Map();
    world.groundFires = new Map();
    world.flameFlyers = [];
    world.lastFireMotion = 0;
    world.nextJetSound = 0;
    world.rabidAnimals = new Map();
    world.deadResidents = new Map();
    world.biteSplashes = [];
    world.lastChaseMotion = 0;
    world.flocks = createFlocks(code);
    world.visibleBirds = [];
    world.birdHits = new Map();
    world.fallenBirds = [];
    world.shots = [];
    world.cataclysmDeck = [];
    world.cataclysmRandom = randomFrom(hash(code + '/катаклизмы'));
    world.cloudLayers = generateCloudLayers(code);
    world.festivalTree = createFestivalTree(world);
    const fragment = '#' + encodeURIComponent(code);
    if (location.hash !== fragment) {
      try { history.replaceState(null, '', fragment); }
      catch { location.hash = fragment; }
    }
    seedField.value = code;
    motion = 0;
    updatePauseTitle();
    rebuildSeason();
    showWeatherNow();
    resetClock();
  }

  function rebuildSeason() {
    world.sceneItems = season === 'winter' ? [...world.items, world.festivalTree].sort((a, b) => a.y - b.y) : world.items;
    seasonalColors = Object.fromEntries(Object.entries(colors).map(([phase, base]) =>
      [phase, seasonalPalette(base, phase)]));
    world.seasonEffects = createSeasonEffects(world);
    layers = Object.fromEntries(Object.entries(seasonalColors).map(([phase, palette]) =>
      [phase, paintLand(world, palette)]));
    rebuildSceneMasks();
    updateSceneCursor();
    weatherPicker.querySelector('option[value="rain"]').textContent = season === 'winter' ? 'Снег' : 'Дождь';
  }

  function rebuildSceneMasks() {
    world.moonMasks = paintMoonlight(world);
    world.foregroundMasks = buildForegroundMasks(world, layers.night.sprites);
    world.propPixels = readPropPixels(layers.night.sprites);
    shadowPosition = -1;
  }

  for (const button of document.querySelectorAll('[data-season]')) {
    button.addEventListener('click', () => {
      if (season === button.dataset.season) return;
      season = button.dataset.season;
      for (const option of document.querySelectorAll('[data-season]')) {
        option.setAttribute('aria-pressed', option === button);
      }
      rebuildSeason();
      changeMusicSeason();
      showWeatherNow();
      resetClock();
    });
  }

  function togglePause() {
    paused = !paused;
    rangerKeys.clear();
    const label = paused ? 'Продолжить' : 'Пауза';
    pauseButton.setAttribute('aria-pressed', paused);
    pauseButton.setAttribute('aria-label', label);
    updatePauseTitle();
    pauseButton.querySelector('.action-label').textContent = label;
    pauseButton.querySelector('.compact-icon').textContent = paused ? '▶' : 'Ⅱ';
    updateSceneCursor();
    if (world.ranger) render();
    resetClock();
    syncAudioPlayback();
  }

  function updatePauseTitle() {
    const label = paused ? 'Продолжить' : 'Пауза';
    pauseButton.title = world?.ranger && !paused ? label : label + ' (пробел)';
  }

  function openSettings(open) {
    settings.hidden = !open;
    settingsToggle.setAttribute('aria-expanded', open);
  }

  function toggleInterface(event) {
    const cornerButton = event?.currentTarget === interfaceToggle;
    ui.hidden = !ui.hidden;
    const label = ui.hidden ? 'Показать интерфейс' : 'Скрыть интерфейс';
    interfaceToggle.setAttribute('aria-label', label);
    interfaceToggle.setAttribute('aria-pressed', ui.hidden);
    interfaceToggle.title = label + ' (H)';
    if (ui.hidden) {
      openSettings(false);
      if (!cornerButton) canvas.focus({ preventScroll: true });
    } else if (!cornerButton) {
      settingsToggle.focus({ preventScroll: true });
    }
  }

  byId('regenerate').addEventListener('click', () => selectVillage(freshCode()));
  byId('seed-form').addEventListener('submit', event => {
    event.preventDefault();
    const code = normalizeCode(seedField.value);
    if (code) selectVillage(code);
  });
  window.addEventListener('hashchange', () => {
    const code = codeFromUrl();
    if (code !== world.code) selectVillage(code || freshCode());
  });

  clock.addEventListener('input', () => {
    simulatedMinutes = clock.valueAsNumber;
    world.seasonEffects.previous.clear();
    showWeatherNow();
  });
  for (const control of [weatherPicker, coverPicker]) {
    control.addEventListener('change', () => {
      if (paused) showWeatherNow();
    });
  }

  settingsToggle.addEventListener('click', () => openSettings(settings.hidden));
  byId('hide-ui').addEventListener('click', toggleInterface);
  interfaceToggle.addEventListener('click', toggleInterface);

  function scenePoint({ clientX, clientY }) {
    const bounds = canvas.getBoundingClientRect();
    return { x: (clientX - bounds.left) * W / bounds.width, y: (clientY - bounds.top) * H / bounds.height };
  }

  function sceneTargets(point) {
    const prop = sceneItemAt(world, point);
    const resident = residentAt(world, point, prop);
    const animal = animalAt(world, point, prop);
    if (resident && (!animal || resident.y >= animal.y)) return { resident };
    if (animal) return { animal };
    return prop?.kind === 'house' ? { house: prop } : {};
  }

  function updateSceneCursor() {
    const point = world && aimPointer && !paused ? scenePoint(aimPointer) : null;
    const { resident, animal, house } = point ? sceneTargets(point) : {};
    canvas.classList.toggle('sheriff', Boolean(resident && (!rangerKeys.size || resident.ranger)));
    canvas.classList.toggle('rabies', Boolean(animal && !world.rabidAnimals.has(animal.animal)));
    canvas.classList.toggle('danger', Boolean(house && !house.cataclysm && !houseHasDamage(house)));
    canvas.classList.toggle('aiming', Boolean(point && !resident && !animal && !house && canAimAt(world, point)));
  }

  const cursor = makeCanvas(25, 25);
  const cursorContext = cursor.getContext('2d');
  for (const [x, y, width, height] of [[12, 3, 1, 6], [12, 16, 1, 6], [3, 12, 6, 1], [16, 12, 6, 1]]) {
    pixels(cursorContext, '#202226', x - 1, y - 1, width + 2, height + 2);
    pixels(cursorContext, '#9df458', x, y, width, height);
  }
  canvas.style.setProperty('--aim-cursor', 'url("' + cursor.toDataURL() + '") 12 12');

  const dangerCursor = makeCanvas(25, 25);
  const dangerContext = dangerCursor.getContext('2d');
  polygon(dangerContext, '#292429', [[12, 1], [24, 23], [0, 23]]);
  polygon(dangerContext, '#ffd16a', [[12, 4], [21, 21], [3, 21]]);
  pixels(dangerContext, '#352629', 11, 10, 3, 6);
  pixels(dangerContext, '#352629', 11, 17, 3, 2);
  canvas.style.setProperty('--danger-cursor', 'url("' + dangerCursor.toDataURL() + '") 12 12');

  const eyesCursor = makeCanvas(32, 24);
  const eyesContext = eyesCursor.getContext('2d');
  for (const side of [-1, 1]) {
    eyesContext.save();
    eyesContext.translate(16, 12);
    eyesContext.scale(side, 1);
    polygon(eyesContext, '#252026', [[1, -1], [15, -8], [15, 3], [9, 7], [4, 5]]);
    polygon(eyesContext, '#d74d42', [[3, 0], [13, -5], [13, 2], [9, 5], [5, 3]]);
    pixels(eyesContext, '#3c2226', 7, -2, 2, 6);
    pixels(eyesContext, '#ffd5a5', 9, -2, 2, 1);
    eyesContext.restore();
  }
  canvas.style.setProperty('--rabies-cursor', 'url("' + eyesCursor.toDataURL() + '") 16 12');

  const sheriffCursor = makeCanvas(28, 28);
  const sheriffContext = sheriffCursor.getContext('2d');
  const star = radius => Array.from({ length: 10 }, (_, i) => {
    const angle = i * Math.PI / 5 - Math.PI / 2;
    const reach = radius * (i % 2 ? 0.46 : 1);
    return [14 + Math.cos(angle) * reach, 14 + Math.sin(angle) * reach];
  });
  polygon(sheriffContext, '#342625', star(13.5));
  polygon(sheriffContext, '#eab75e', star(10.6));
  ellipse(sheriffContext, '#ffe1a2', 14, 14, 3.5, 3.5);
  pixels(sheriffContext, '#956734', 13, 14, 3);
  canvas.style.setProperty('--sheriff-cursor', 'url("' + sheriffCursor.toDataURL() + '") 14 14');

  canvas.addEventListener('pointermove', event => {
    aimPointer = event.pointerType === 'mouse' ? { clientX: event.clientX, clientY: event.clientY } : null;
    if (aimPointer && !paused && !world.ranger) {
      const { resident } = sceneTargets(scenePoint(aimPointer));
      if (resident) {
        setRanger(world, resident);
        canvas.focus({ preventScroll: true });
        render();
      }
    }
    updateSceneCursor();
  });
  canvas.addEventListener('pointerleave', event => {
    if (event.pointerType !== 'mouse') return;
    aimPointer = null;
    updateSceneCursor();
  });
  window.addEventListener('resize', updateSceneCursor);
  let scenePointerType = '';
  canvas.addEventListener('pointerdown', event => {
    if (event.isPrimary) scenePointerType = event.pointerType;
  });
  canvas.addEventListener('click', event => {
    const pointerType = event.pointerType || (event.detail ? scenePointerType : '');
    scenePointerType = '';
    const mouse = pointerType === 'mouse';
    if ((mouse || pointerType === 'touch') && !paused) {
      if (mouse && rangerKeys.has('Space')) return;
      const point = scenePoint(event);
      const { resident, animal, house } = sceneTargets(point);
      if (resident) {
        if (mouse) {
          setRanger(world, resident);
          render();
        }
        return;
      }
      if ((house && (house.cataclysm || houseHasDamage(house))) || (animal && world.rabidAnimals.has(animal.animal))) return;
      if (animal || house || canAimAt(world, point)) {
        if (!ui.hidden) openSettings(false);
        if (animal) startRabidChase(world, animal, motion);
        else if (house) startCataclysm(world, house, motion);
        else fireAt(world, point, motion);
        render();
        return;
      }
    }
    if (mouse && !compactInterface.matches && ui.hidden) {
      toggleInterface();
    } else if (!ui.hidden) {
      openSettings(false);
    }
  });
  pauseButton.addEventListener('click', togglePause);

  if (!document.fullscreenEnabled) fullscreenButton.hidden = true;
  fullscreenButton.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await byId('village').requestFullscreen();
    } catch {
      fullscreenButton.hidden = true;
    }
  });
  document.addEventListener('fullscreenchange', () => {
    const label = document.fullscreenElement ? 'Выйти из полного экрана' : 'На весь экран';
    fullscreenButton.setAttribute('aria-label', label);
    fullscreenButton.querySelector('.action-label').textContent = label;
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) rangerKeys.clear();
    resetClock();
    syncAudioPlayback();
  });
  window.addEventListener('blur', () => rangerKeys.clear());
  document.addEventListener('keyup', event => {
    if (rangerKeys.delete(event.code) && event.code === 'Space') render();
  });
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.key === 'Escape') {
      if (event.repeat) return;
      if (ui.hidden) toggleInterface();
      else if (!settings.hidden) {
        openSettings(false);
        settingsToggle.focus();
      }
      return;
    }
    if (event.target.closest('input, select')) return;
    if (world.ranger && !paused && (rangerDirections[event.code] ||
      (event.code === 'Space' && !event.target.closest('button')))) {
      event.preventDefault();
      if (!rangerKeys.has(event.code)) {
        rangerKeys.add(event.code);
        if (event.code === 'Space') render();
      }
      return;
    }
    if (event.repeat) return;
    if (event.code === 'Space' && !event.target.closest('button')) {
      event.preventDefault();
      togglePause();
    }
    if (event.code === 'KeyH') toggleInterface();
  });

  selectVillage(codeFromUrl() || freshCode());
})();
</script>
</body>
</html>
